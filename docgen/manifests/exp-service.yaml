defaults:
  heading: '### Fields'
  omit_origins:
  - ListenOptions
  - InboundOptions

pages:

- file: experimental/cache-file.md
  defs:
  - name: CacheFileOptions
    root: CacheFileOptions
    omit_origins: []

- file: experimental/clash-api.md
  defs:
  - name: ClashAPIOptions
    root: ClashAPIOptions
    omit_origins: []

- file: experimental/v2ray-api.md
  defs:
  - name: V2RayAPIOptions
    root: V2RayAPIOptions
    omit_origins: []
  expand:
  - stats

- file: service/api.md
  defs:
  - name: api

- file: service/ccm.md
  defs:
  - name: ccm

- file: service/derp.md
  defs:
  - name: derp

- file: service/hysteria-realm.md
  defs:
  - name: hysteria-realm
    omit_origins:
    - ListenOptions
    - HTTP2Options
    - InboundOptions
  expand:
  - users
  overrides:
    tls:
      prose: |-
        TLS configuration, see [TLS](/configuration/shared/tls/#inbound).

        When configured, the realm serves HTTP/2 over TLS; otherwise plain HTTP/1.1.

- file: service/ocm.md
  defs:
  - name: ocm

- file: service/resolved.md
  defs:
  - name: resolved
    registry: Service
  - name: resolved-listen
    root: ResolvedServiceOptions
    omit_origins: []
    include_keys:
    - listen
    - listen_port
  overrides:
    listen:
      prose: |-
        @required

        Listen address.

        `127.0.0.53` will be used by default.
    listen_port:
      prose: |-
        @required

        Listen port.

        `53` will be used by default.

- file: service/ssm-api.md
  defs:
  - name: ssm-api

- file: service/usbip-client.md
  defs:
  - name: usbip-client
    omit_origins:
    - DialerOptions
    - AbstractDialerOptions
  overrides:
    server:
      prose: |-
        @required

        The remote `usbip-server` address.
    server_port:
      prose: The remote `usbip-server` port. Defaults to `3240`.

- file: service/usbip-server.md
  defs:
  - name: usbip-server
    registry: Service
  - name: usbip-server
    registry: Service
    root: USBIPDefaultProviderOptions
    include_keys:
    - devices
  overrides:
    devices:
      prose: |-
        ==Required== with the `default` provider.

        List of device matches selecting which local USB devices to export.

        Object format:

        ```json
        {
          "bus_id": "",
          "vendor_id": 0,
          "product_id": 0,
          "serial": ""
        }
        ```

        Object fields:

        - `bus_id`: USB bus ID, e.g. `1-2`.
        - `vendor_id`: USB vendor ID, as a number.
        - `product_id`: USB product ID, as a number.
        - `serial`: Device serial number.

        Within one object, all specified fields must match; multiple objects are combined as a union. At
        least one field is required.

