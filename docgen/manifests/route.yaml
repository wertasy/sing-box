defaults:
  heading: '### Fields'
pages:
- file: route/index.md
  defs:
  - name: RouteOptions
    root: RouteOptions
- file: route/rule.md
  sections:
  - heading: '### Default Fields'
    defs:
    - name: default
      registry: Rule
      root: RawDefaultRule
  - heading: '### Logical Fields'
    defs:
    - name: logical
      registry: Rule
      root: RawLogicalRule
      omit_keys:
      - invert
- file: route/rule_action.md
  sections:
  - heading: '### route'
    defs:
    - name: route
      registry: RuleAction
      root: RouteActionOptions
      omit_keys:
      - action
      - override_address
      - override_port
      - network_strategy
      - fallback_delay
      - udp_disable_domain_unmapping
      - udp_connect
      - udp_timeout
      - tls_fragment
      - tls_fragment_fallback_delay
      - tls_record_fragment
      - tls_spoof
      - tls_spoof_method
  - heading: '### bypass'
    defs:
    - name: route
      registry: RuleAction
      root: BypassActionOptions
      omit_keys:
      - action
      - override_address
      - override_port
      - network_strategy
      - fallback_delay
      - udp_disable_domain_unmapping
      - udp_connect
      - udp_timeout
      - tls_fragment
      - tls_fragment_fallback_delay
      - tls_record_fragment
      - tls_spoof
      - tls_spoof_method
  - heading: '### reject'
    defs:
    - name: reject
      registry: RuleAction
      root: _RejectActionOptions
      omit_keys:
      - action
  - heading: '### route-options'
    defs:
    - name: route-options
      registry: RuleAction
      root: RawRouteOptionsActionOptions
      omit_keys:
      - action
  - heading: '### sniff'
    defs:
    - name: sniff
      root: RouteActionSniff
      omit_keys:
      - action
  - heading: '### resolve'
    defs:
    - name: resolve
      root: RouteActionResolve
      omit_keys:
      - action
- file: rule-set/headless-rule.md
  sections:
  - heading: '### Default Fields'
    defs:
    - name: default
      registry: HeadlessRule
      root: DefaultHeadlessRule
  - heading: '### Logical Fields'
    defs:
    - name: logical
      registry: HeadlessRule
      root: LogicalHeadlessRule
      omit_keys:
      - invert
- file: route/index.zh.md
  patches:
    '### Fields':
      remove_keys:
      - rule
      - network_strategy
- file: route/rule_action.zh.md
