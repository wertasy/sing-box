defaults:
  heading: '### Fields'
  omit_origins:
  - DialerOptions
  - AbstractDialerOptions
pages:

- file: outbound/hysteria.md
  sections:

  - defs:

    - name: hysteria
      registry: Outbound
      omit_keys:
      - up
      - down
      - up_mbps
      - down_mbps
      - idle_timeout
      - keep_alive_period
      - stream_receive_window
      - connection_receive_window
      - max_concurrent_streams
      - initial_packet_size
      - disable_path_mtu_discovery
      - tag
    extras:
      up, down:
        prose: |-
          @required

          Format: `[Integer] [Unit]` e.g. `100 Mbps, 640 KBps, 2 Gbps`

          Supported units (case sensitive, b = bits, B = bytes, 8b=1B):

              bps (bits per second)
              Bps (bytes per second)
              Kbps (kilobits per second)
              KBps (kilobytes per second)
              Mbps (megabits per second)
              MBps (megabytes per second)
              Gbps (gigabits per second)
              GBps (gigabytes per second)
              Tbps (terabits per second)
              TBps (terabytes per second)
        locale_key: HysteriaOutboundOptions.up_down
      up_mbps, down_mbps:
        prose: |-
          @required

          `up, down` in Mbps.
        locale_key: HysteriaOutboundOptions.up_down_mbps
    overrides:
      tls:
        prose: |-
          @required

          TLS configuration, see [TLS](/configuration/shared/tls/#outbound).

  - heading: '### Deprecated Fields'
    extras:
      recv_window_conn:
        prose: |-
          @failure: Deprecated in sing-box 1.14.0

              Use QUIC fields `stream_receive_window` instead.
        locale_key: HysteriaOutboundOptions.recv_window_conn
      recv_window:
        prose: |-
          @failure: Deprecated in sing-box 1.14.0

              Use QUIC fields `connection_receive_window` instead.
        locale_key: HysteriaOutboundOptions.recv_window
      disable_mtu_discovery:
        prose: |-
          @failure: Deprecated in sing-box 1.14.0

              Use QUIC fields `disable_path_mtu_discovery` instead.
        locale_key: HysteriaOutboundOptions.disable_mtu_discovery

- file: outbound/hysteria2.md
  sections:

  - defs:

    - name: hysteria2
      registry: Outbound
      omit_keys:
      - up_mbps
      - down_mbps
      - realm
      - idle_timeout
      - keep_alive_period
      - stream_receive_window
      - connection_receive_window
      - max_concurrent_streams
      - initial_packet_size
      - disable_path_mtu_discovery
      - obfs
      - tag
      - bbr_profile
      - brutal_debug
      - disable_chrome_parrot
    expand:
    - obfs
    extras:
      up_mbps, down_mbps:
        prose: |-
          Max bandwidth, in Mbps.

          If empty, the BBR congestion control algorithm will be used instead of Hysteria CC.
        locale_key: Hysteria2OutboundOptions.up_down_mbps
    overrides:
      tls:
        prose: |-
          @required

          TLS configuration, see [TLS](/configuration/shared/tls/#outbound).
      server:
        prose: |-
          @required

          The server address.

          Conflicts with `realm`.
      server_port:
        prose: |-
          @required

          The server port.

          Ignored if `server_ports` is set.

          Conflicts with `realm`.

  - heading: '### QUIC Fields'
    defs:

    - name: hysteria2
      registry: Outbound
      omit_origins:
      - DialerOptions
      - AbstractDialerOptions
      - ServerOptions
      - OutboundTLSOptionsContainer
      - QUICOptions
      - HTTP2Options
      omit_keys:
      - server_ports
      - hop_interval
      - hop_interval_max
      - up_mbps
      - down_mbps
      - obfs
      - password
      - network
      - tls
      - tag
      include_keys:
      - bbr_profile
      - brutal_debug
      - disable_chrome_parrot
      - realm
      - realm.server_url
      - realm.token
      - realm.realm_id
      - realm.stun_servers
      - realm.ip_version
      - realm.port_mapping
      - realm.port_mapping.enabled
      - realm.port_mapping.timeout
      - realm.port_mapping.lifetime
      - realm.http_client
    expand:
    - realm

- file: outbound/tuic.md
  defs:

  - name: tuic
    registry: Outbound
    omit_keys:
    - idle_timeout
    - keep_alive_period
    - stream_receive_window
    - connection_receive_window
    - max_concurrent_streams
    - initial_packet_size
    - disable_path_mtu_discovery
    - tag
  overrides:
    tls:
      prose: |-
        @required

        TLS configuration, see [TLS](/configuration/shared/tls/#outbound).

- file: outbound/snell.md
  defs:

  - name: snell
    registry: Outbound
    omit_keys:
    - tag
  expand:
  - ObfsOptions
  - V6Options

- file: outbound/shadowsocks.md
  defs:

  - name: shadowsocks
    registry: Outbound
