defaults:
  heading: '### Fields'
pages:
- file: outbound/hysteria.md
  example:
    omit:
    - idle_timeout
    - keep_alive_period
    - stream_receive_window
    - connection_receive_window
    - max_concurrent_streams
    - initial_packet_size
    - disable_path_mtu_discovery
    groups:
    - QUIC Fields
  sections:
  - defs:
    - omit_keys:
      - idle_timeout
      - keep_alive_period
      - stream_receive_window
      - connection_receive_window
      - max_concurrent_streams
      - initial_packet_size
      - disable_path_mtu_discovery
      name: hysteria
      registry: Outbound
- file: outbound/hysteria2.md
  sections:
  - defs:
    - omit_keys:
      - realm
      - idle_timeout
      - keep_alive_period
      - stream_receive_window
      - connection_receive_window
      - max_concurrent_streams
      - initial_packet_size
      - disable_path_mtu_discovery
      - bbr_profile
      - brutal_debug
      - disable_chrome_parrot
      name: hysteria2
      registry: Outbound
    expand:
    - obfs
  - heading: '### QUIC Fields'
    defs:
    - omit_origins:
      - ServerOptions
      - OutboundTLSOptionsContainer
      - QUICOptions
      - HTTP2Options
      omit_keys:
      - server_ports
      - hop_interval
      - hop_interval_max
      - password
      - network
      - tls
      include_keys:
      - bbr_profile
      - brutal_debug
      - disable_chrome_parrot
      - realm
      - realm.server_url
      - realm.token
      - realm.realm_id
      - realm.stun_servers
      - realm.ip_version
      - realm.port_mapping
      - realm.port_mapping.enabled
      - realm.port_mapping.timeout
      - realm.port_mapping.lifetime
      - realm.http_client
      name: hysteria2
      registry: Outbound
    expand:
    - realm
- file: outbound/tuic.md
  example:
    omit:
    - idle_timeout
    - keep_alive_period
    - stream_receive_window
    - connection_receive_window
    - max_concurrent_streams
    - initial_packet_size
    - disable_path_mtu_discovery
    groups:
    - QUIC Fields
  defs:
  - omit_keys:
    - idle_timeout
    - keep_alive_period
    - stream_receive_window
    - connection_receive_window
    - max_concurrent_streams
    - initial_packet_size
    - disable_path_mtu_discovery
- file: outbound/snell.md
  defs:
  expand:
  - ObfsOptions
  - V6Options
- file: outbound/shadowsocks.md
  defs:
