defaults:
  heading: '### Fields'
  omit_origins:
  - ListenOptions
  - InboundOptions

pages:

- file: inbound/socks.md
  defs:
  - name: socks
    registry: Inbound
    omit_keys:
    - tag
    - domain_resolver

- file: inbound/http.md
  defs:
  - name: http
    registry: Inbound
    omit_keys:
    - tag
    - domain_resolver
    - idle_timeout
    - keep_alive_period
    - stream_receive_window
    - connection_receive_window
    - max_concurrent_streams
    - initial_packet_size
    - disable_path_mtu_discovery

- file: inbound/mixed.md
  defs:
  - name: mixed
    omit_keys:
    - tag
    - domain_resolver

- file: inbound/direct.md
  defs:
  - name: direct
    registry: Inbound

- file: inbound/vless.md
  defs:
  - name: vless
    registry: Inbound
    omit_keys:
    - tag
    - users.name
  expand:
  - users

- file: inbound/vmess.md
  defs:
  - name: vmess
    registry: Inbound

- file: inbound/snell.md
  defs:
  - name: snell
    registry: Inbound
    omit_keys:
    - tag
  expand:
  - ObfsOptions
  - V6Options

- file: inbound/shadowsocks.md
  defs:
  - name: shadowsocks
    registry: Inbound
    omit_keys:
    - tag
    - users
    - destinations

- file: inbound/naive.md
  defs:
  - name: naive
    registry: Inbound

- file: inbound/tailcat.md
  defs:
  - name: tailcat
    registry: Inbound
    omit_origins:
    - DialerOptions
    omit_keys:
    - tag
    - users.name
  expand:
  - users
  overrides:
    derp_map_url:
      prose: |-
        URL of the [DERP map](https://pkg.go.dev/tailscale.com/tailcfg#DERPMap).

        `https://tailcat.dev/derpmap.json` is used by default.
    derp_servers:
      prose: |-
        Custom DERP servers in [DERPNode](https://pkg.go.dev/tailscale.com/tailcfg#DERPNode) format, with
        snake_case field names.

        Conflicts with `derp_map_url` and `derp_region`.

        Setting Array value to a string `__HOST__` is equivalent to configuring:

        ```json
        { "host": __HOST__ }
        ```

- file: inbound/cloudflared.md
  defs:
  - name: cloudflared
    omit_origins: []

- file: inbound/tproxy.md
  defs:
  - name: tproxy
    omit_keys:
    - tag
    - udp_mapping
    - udp_filtering
    - udp_nat_max
