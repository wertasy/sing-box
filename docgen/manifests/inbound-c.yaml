defaults:
  heading: '### Fields'
  omit_origins:
  - InboundOptions
pages:
- file: inbound/socks.md
  example:
    omit:
    - domain_resolver
  defs:
- file: inbound/http.md
  example:
    omit:
    - domain_resolver
    groups:
    - HTTP2 Fields / QUIC Fields
  defs:
  - omit_keys:
    - idle_timeout
    - keep_alive_period
    - stream_receive_window
    - connection_receive_window
    - max_concurrent_streams
    - initial_packet_size
    - disable_path_mtu_discovery
- file: inbound/mixed.md
  example:
    omit:
    - domain_resolver
    - tls
  defs:
- file: inbound/direct.md
  defs:
- file: inbound/vless.md
  defs:
  - omit_keys:
    - users.name
  expand:
  - users
- file: inbound/vmess.md
  defs:
- file: inbound/snell.md
  defs:
  expand:
  - ObfsOptions
  - V6Options
- file: inbound/shadowsocks.md
  example:
    omit:
    - network
    - users
    - destinations
  defs:
- file: inbound/naive.md
  defs:
- file: inbound/tailcat.md
  defs:
  - omit_origins:
    - DialerOptions
    include_origins:
    - AbstractDialerOptions
    - ListenOptions
    omit_keys:
    - users.name
    - protect_path
  expand:
  - users
- file: inbound/cloudflared.md
  defs:
- file: inbound/tproxy.md
  example:
    omit:
    - udp_timeout
    - udp_mapping
    - udp_filtering
    - udp_nat_max
    groups:
    - UDP NAT Fields
  defs:
