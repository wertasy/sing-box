- file: dns/rule_action.md
  sections:
  - defs:
    - name: route
      omit_keys:
      - server
      - speculative
      - timeout
      - disable_cache
      - disable_optimistic_cache
      - rewrite_ttl
      - client_subnet
      - remove_client_subnet
      - strategy
      registry: DNSRuleAction
      root: _DNSRuleAction
    heading: '### Structure'
  - defs:
    - name: route
      omit_keys:
      - action
      - race
      registry: DNSRuleAction
      root: DNSRouteActionOptions
    heading: '### route'
  - defs:
    - name: evaluate
      docs_tag: true
      omit_keys:
      - action
      - race
      root: DNSEvaluateActionOptions
    heading: '### evaluate'
  - defs:
    - name: reject
      omit_keys:
      - action
      - race
      registry: DNSRuleAction
      root: DNSRejectActionOptions
    heading: '### reject'
  - defs:
    - name: predefined
      omit_keys:
      - action
      - race
      root: DNSRouteActionPredefined
    heading: '### predefined'
