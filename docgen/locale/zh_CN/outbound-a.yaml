AnyTLSOutboundOptions.client_metadata: |-
  @since 1.13.16

  参阅 [AnyTLS 客户端元数据](/zh/manual/misc/anytls-client-metadata/)。

AnyTLSOutboundOptions.idle_session_check_interval: 检查空闲会话的时间间隔。默认值：30秒。

AnyTLSOutboundOptions.idle_session_timeout: 在检查中，关闭闲置时间超过此值的会话。默认值：30秒。

AnyTLSOutboundOptions.min_idle_session: 在检查中，至少前 `n` 个空闲会话保持打开状态。默认值：`n`=0

AnyTLSOutboundOptions.password: |-
  @required

  AnyTLS 密码。

AnyTLSOutboundOptions.tls: |-
  @required

  TLS 配置, 参阅 [TLS](/zh/configuration/shared/tls/#出站)。

BridgeOutboundOptions.bridge_name: |-
  自定义 bridge TUN 接口名前缀，默认使用 `bridge`。

  在 Apple 平台上无效。

BridgeOutboundOptions.interface: |-
  转发流量流出的网络接口名称。

  默认使用默认接口。

BridgeOutboundOptions.iproute2_rule_index: |-
  @quote:

      仅支持 Linux。

  Linux iproute2 规则起始索引。

  默认使用 `100`。

BridgeOutboundOptions.iproute2_table_index: |-
  @quote:

      仅支持 Linux。

  Linux iproute2 路由表索引。

  默认使用 `2200` + 实例索引。

DirectOutboundOptions.override_address: |-
  @failure: 已在 sing-box 1.11.0 废弃

      目标覆盖字段在 sing-box 1.11.0 中已废弃，并将在 sing-box 1.13.0 中被移除，参阅 [迁移指南](/zh/migration/#迁移-direct-出站中的目标地址覆盖字段到路由字段)。

  覆盖连接目标地址。

DirectOutboundOptions.override_port: |-
  @failure: 已在 sing-box 1.11.0 废弃

      目标覆盖字段在 sing-box 1.11.0 中已废弃，并将在 sing-box 1.13.0 中被移除，参阅 [迁移指南](/zh/migration/#迁移-direct-出站中的目标地址覆盖字段到路由字段)。

  覆盖连接目标端口。

NaiveOutboundOptions.extra_headers: HTTP 请求中发送的额外头部。

NaiveOutboundOptions.insecure_concurrency: 并发隧道连接数。多连接使隧道更容易被流量分析检测，违背 NaiveProxy 抵抗流量分析的设计目的。

NaiveOutboundOptions.password: 认证密码。

NaiveOutboundOptions.quic: 使用 QUIC 代替 HTTP/2。

NaiveOutboundOptions.quic_congestion_control: |-
  QUIC 拥塞控制算法。

  | 算法 | 描述 |
  |------|------|
  | `bbr` | BBR |
  | `bbr2` | BBRv2 |
  | `cubic` | CUBIC |
  | `reno` | New Reno |

  默认使用 `cubic`（NaiveProxy 基于的 Chromium 的默认值）。

NaiveOutboundOptions.quic_session_receive_window: |-
  @note:

      仅在 `quic` 启用时使用。

  QUIC 初始会话接收窗口。

  默认使用 `15 MB`。

NaiveOutboundOptions.stream_receive_window: |-
  流量控制窗口。

  当 `quic` 启用时，它设置 QUIC 初始流接收窗口，默认使用 `6 MB`。

  否则，它设置 HTTP/2 会话接收窗口，流接收窗口被设置为它的一半，在 iOS 上默认使用 `4 MB`，在其他平台上默认使用 `128 MB`。

NaiveOutboundOptions.tls: |-
  @required

  TLS 配置, 参阅 [TLS](/zh/configuration/shared/tls/#出站)。

  只有 `server_name`、`certificate`、`certificate_path` 和 `ech` 是被支持的。

  自签名证书会显著改变流量行为，违背了 NaiveProxy 旨在抵抗流量分析的设计初衷，不应该在生产环境中使用。

NaiveOutboundOptions.udp_over_tcp: |-
  UDP over TCP 配置。

  参阅 [UDP Over TCP](/zh/configuration/shared/udp-over-tcp/)。

NaiveOutboundOptions.username: 认证用户名。

SOCKSOutboundOptions.network: |-
  启用的网络协议

  `tcp` 或 `udp`。

  默认所有。

SOCKSOutboundOptions.password: SOCKS5 密码。

SOCKSOutboundOptions.udp_over_tcp: |-
  UDP over TCP 配置。

  参阅 [UDP Over TCP](/zh/configuration/shared/udp-over-tcp/)。

SOCKSOutboundOptions.username: SOCKS 用户名。

SOCKSOutboundOptions.version: |-
  SOCKS 版本, 可为 `4` `4a` `5`.

  默认使用 SOCKS5。

_HTTPOutboundOptions.disable_version_fallback: |-
  @since 1.15.0

  禁用自动回退到更低的 HTTP 版本。

_HTTPOutboundOptions.headers: HTTP 请求的额外标头。

_HTTPOutboundOptions.password: Basic 认证密码。

_HTTPOutboundOptions.path: HTTP 请求路径。

_HTTPOutboundOptions.tls: TLS 配置, 参阅 [TLS](/zh/configuration/shared/tls/#出站)。

_HTTPOutboundOptions.username: Basic 认证用户名。

_HTTPOutboundOptions.version: |-
  @since 1.15.0

  HTTP 版本。

  可用值：`1`、`2`、`3`。

  默认使用 `2`；设置了 `path` 或 `Host` 头时默认使用 `1`。

  `path` 和 `Host` 头仅在 `1` 时可用。

  当为 `3` 时，[HTTP2 字段](#http2-字段) 替换为 [QUIC 字段](#quic-字段)。
