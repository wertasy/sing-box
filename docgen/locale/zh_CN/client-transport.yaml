ACMEProviderDNS01Challenge.acmedns: |-
  ```json
  {
    "provider": "acmedns",
    "username": "",
    "password": "",
    "subdomain": "",
    "server_url": ""
  }
  ```

  参阅 [ACME-DNS](https://github.com/joohoi/acme-dns)。

  @Since 1.13.0

ACMEProviderDNS01Challenge.alidns: |-
  ```json
  {
    "provider": "alidns",
    "access_key_id": "",
    "access_key_secret": "",
    "region_id": "",
    "security_token": ""
  }
  ```

  ##### security_token

  用于 STS 临时凭证的安全令牌。

  @Since 1.13.0

ACMEProviderDNS01Challenge.cloudflare: |-
  ```json
  {
    "provider": "cloudflare",
    "api_token": "",
    "zone_token": ""
  }
  ```

  ##### zone_token

  具有 `Zone:Read` 权限的可选 API 令牌。

  提供后可将 `api_token` 限定到单个区域。

  @Since 1.13.0

ACMEProviderDNS01Challenge.provider: DNS 提供商。提供商专有字段见下文。

ACMEProviderDNS01ChallengeOptions.provider: DNS 提供商。提供商专有字段见下文。

AbstractACMEProviderDNS01ChallengeOptions.override_domain: |-
  覆盖 DNS 质询记录使用的域名。

  适用于将 `_acme-challenge` 委托到其他 zone 的场景。

  @Since 1.14.0

AbstractACMEProviderDNS01ChallengeOptions.propagation_delay: |-
  创建质询记录后，在开始传播检查前要等待的时间。

  @Since 1.14.0

AbstractACMEProviderDNS01ChallengeOptions.propagation_timeout: |-
  等待质询记录传播完成的最长时间。

  设为 `-1` 可禁用传播检查。

  @Since 1.14.0

AbstractACMEProviderDNS01ChallengeOptions.resolvers: |-
  进行 DNS 传播检查时优先使用的 DNS 解析器。

  @Since 1.14.0

AbstractACMEProviderDNS01ChallengeOptions.ttl: |-
  DNS 质询临时 TXT 记录的 TTL。

  @Since 1.14.0

HTTP2Options.connection_receive_window: |-
  HTTP2 连接级别流控接收窗口大小。

  接受内存大小格式，例如 `"64 MB"`。

HTTP2Options.idle_timeout: 空闲连接超时，采用 golang 的 Duration 格式。

HTTP2Options.keep_alive_period: Keep alive 周期，采用 golang 的 Duration 格式。

HTTP2Options.max_concurrent_streams: 每个连接的最大并发流数。

HTTP2Options.stream_receive_window: |-
  HTTP2 流级别流控接收窗口大小。

  接受内存大小格式，例如 `"64 MB"`。

HTTPClientOptions.disable_version_fallback: 禁用自动回退到更低的 HTTP 版本。

HTTPClientOptions.engine: |-
  要使用的 HTTP 引擎。

  可用值：

  * `go`（默认）
  * `apple`

  `apple` 使用 NSURLSession，仅在 Apple 平台可用。

  支持的字段：

  * `headers`
  * `tls.server_name`（必须与请求主机匹配）
  * `tls.insecure`
  * `tls.min_version` / `tls.max_version`
  * `tls.certificate` / `tls.certificate_path`
  * `tls.certificate_sha256`
  * `tls.certificate_public_key_sha256`
  * 拨号字段

  不支持的字段：

  * `version`
  * `disable_version_fallback`
  * HTTP2 字段
  * QUIC 字段
  * `tls.engine`
  * `tls.alpn`
  * `tls.disable_sni`
  * `tls.cipher_suites`
  * `tls.curve_preferences`
  * `tls.client_certificate` / `tls.client_certificate_path` / `tls.client_key` / `tls.client_key_path`
  * `tls.fragment` / `tls.record_fragment`
  * `tls.kernel_tx` / `tls.kernel_rx`
  * `tls.ech`
  * `tls.utls`
  * `tls.reality`

  @Warning:

      仅供实验用途：不应在 iOS 和 tvOS 的热路径中使用。

HTTPClientOptions.headers: |-
  自定义 HTTP 标头。

  `Host` 标头用作请求主机。

HTTPClientOptions.version: |-
  HTTP 版本。

  可用值：`1`、`2`、`3`。

  当为 `3` 时，[HTTP2 字段](#http2-字段) 替换为 [QUIC 字段](#quic-字段)。

QUICOptions.disable_path_mtu_discovery: 禁用 QUIC 路径 MTU 发现。

QUICOptions.initial_packet_size: 初始 QUIC 数据包大小。

UDPOverTCPOptions.enabled: 启用 UDP over TCP 协议。

UDPOverTCPOptions.version: |-
  协议版本，`1` 或 `2`。

  默认使用 2。

