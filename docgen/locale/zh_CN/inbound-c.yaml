AbstractSnellInboundOptions.psk: |-
  @required

  预共享密钥。

AbstractSnellInboundOptions.users: |-
  Snell 用户。

  设置后，服务器运行于多用户模式：每一项包含 `name`（可选，用于日志）和 `userkey`
  （用户密钥）。

CloudflaredInboundOptions.control_dialer: |-
  隧道客户端拨向 Cloudflare 控制面时使用的
  [拨号字段](/zh/configuration/shared/dial/)。

CloudflaredInboundOptions.datagram_version: |-
  通过 QUIC 进行 UDP 代理时使用的数据报协议版本。

  `v2` `v3` 之一。仅在 `protocol` 为 `quic` 时有效。

CloudflaredInboundOptions.edge_ip_version: |-
  连接 Cloudflare edge 时使用的 IP 版本。

  `0`（自动）`4` `6` 之一。

CloudflaredInboundOptions.grace_period: 正在处理的 edge 连接的优雅关闭窗口。

CloudflaredInboundOptions.ha_connections: |-
  到 Cloudflare edge 的高可用连接数。

  上限为已发现的 edge 地址数量。

CloudflaredInboundOptions.post_quantum: 在控制连接上启用后量子密钥交换。

CloudflaredInboundOptions.protocol: |-
  edge 连接使用的传输协议。

  `quic` `http2` 之一。

CloudflaredInboundOptions.region: |-
  Cloudflare edge 区域选择器。

  与 `token` 中嵌入的 endpoint 冲突。

CloudflaredInboundOptions.token: |-
  @required

  来自 Cloudflare Zero Trust 仪表板的 Base64 编码隧道令牌
  （`Networks → Tunnels → Install connector`）。

CloudflaredInboundOptions.tunnel_dialer: |-
  隧道客户端拨向 Cloudflare edge 数据面时使用的
  [拨号字段](/zh/configuration/shared/dial/)。

DirectInboundOptions.network: |-
  监听的网络协议，`tcp` `udp` 之一。

  默认所有。

DirectInboundOptions.override_address: 覆盖连接目标地址。

DirectInboundOptions.override_port: 覆盖连接目标端口。

HTTPMixedInboundOptions.set_system_proxy: |-
  @quote:

      仅支持 Linux、Android、Windows 和 macOS。

  @warning:

      要在无特权的 Android 和 iOS 上工作，请改用 tun.platform.http_proxy。

  启动时自动设置系统代理，停止时自动清理。

HTTPMixedInboundOptions.users: |-
  SOCKS 和 HTTP 用户

  如果为空则不需要验证。

NaiveInboundOptions.network: |-
  监听的网络协议，`tcp` `udp` 之一。

  默认所有。

NaiveInboundOptions.quic_congestion_control: |-
  @question: Since sing-box 1.13.0

  QUIC 拥塞控制算法。

  | 算法             | 描述                 |
  |----------------|--------------------|
  | `bbr`          | BBR                |
  | `cubic`        | CUBIC              |
  | `reno`         | New Reno           |

  默认使用 `bbr`。

NaiveInboundOptions.users: |-
  @required

  Naive 用户。

ShadowsocksInboundOptions.managed: 默认为 `false`。当该入站需要由 [SSM API](/zh/configuration/service/ssm-api) 管理用户时必须启用此字段。

ShadowsocksInboundOptions.method: |-
  @required

  | 方法                            | 密钥长度 |
  |-------------------------------|------|
  | 2022-blake3-aes-128-gcm       | 16   |
  | 2022-blake3-aes-256-gcm       | 32   |
  | 2022-blake3-chacha20-poly1305 | 32   |
  | none                          | /    |
  | aes-128-gcm                   | /    |
  | aes-192-gcm                   | /    |
  | aes-256-gcm                   | /    |
  | chacha20-ietf-poly1305        | /    |
  | xchacha20-ietf-poly1305       | /    |

ShadowsocksInboundOptions.multiplex: 参阅 [多路复用](/zh/configuration/shared/multiplex#入站)。

ShadowsocksInboundOptions.network: |-
  监听的网络协议，`tcp` `udp` 之一。

  默认所有。

ShadowsocksInboundOptions.password: |-
  @required

  | 方法            | 密码格式                                     |
  |---------------|------------------------------------------|
  | none          | /                                        |
  | 2022 methods  | `sing-box generate rand --base64 <密钥长度>` |
  | other methods | 任意字符串                                    |

SnellInboundOptions.mode: |-
  @indicator: 仅版本 6

  流量整形模式，`default` `unshaped` `unsafe-raw` 之一。

  默认为 `default`。

SocksInboundOptions.users: |-
  SOCKS 用户

  如果为空则不需要验证。

TProxyInboundOptions.network: |-
  监听的网络协议，`tcp` `udp` 之一。

  默认所有。

TailcatInboundOptions.derp_map_url: |-
  [DERP map](https://pkg.go.dev/tailscale.com/tailcfg#DERPMap) 的 URL。

  默认使用 `https://tailcat.dev/derpmap.json`。

TailcatInboundOptions.derp_region: |-
  DERP map 中的 DERP 区域 ID。

  与 `derp_servers` 冲突。

TailcatInboundOptions.derp_servers: |-
  自定义 DERP 服务器，为 [DERPNode](https://pkg.go.dev/tailscale.com/tailcfg#DERPNode) 格式，字段名使用 snake_case。

  与 `derp_map_url` 和 `derp_region` 冲突。

  将数组值设置为字符串 `__HOST__` 等同于配置：

  ```json
  { "host": __HOST__ }
  ```

TailcatInboundOptions.http_client: |-
  用于获取 DERP map 的 HTTP 客户端。

  参阅 [HTTP 客户端](/zh/configuration/shared/http-client/) 了解详情。

TailcatInboundOptions.pre_shared_key: 预共享密钥。

TailcatInboundOptions.private_key: |-
  @required

  私钥。

  使用 `sing-box generate tailcat-keypair` 生成。

TailcatInboundOptions.users: |-
  Tailcat 用户。

  为空时不验证客户端。

  如需使用带客户端验证的 DERP 服务器，在 [DERP 服务](/zh/configuration/service/derp/#verify_client_inbound)
  中设置 `verify_client_inbound` 或 `verify_client_key`，且客户端必须使用固定的私钥。

TailcatInboundOptions.users.public_key: |-
  @required

  客户端公钥。

VLESSInboundOptions.multiplex: 参阅 [多路复用](/zh/configuration/shared/multiplex#入站)。

VLESSInboundOptions.transport: V2Ray 传输配置，参阅 [V2Ray 传输层](/zh/configuration/shared/v2ray-transport/)。

VLESSInboundOptions.users: |-
  @required

  VLESS 用户。

VLESSInboundOptions.users.flow: |-
  VLESS 子协议。

  可用值：

  * `xtls-rprx-vision`

VLESSInboundOptions.users.uuid: |-
  @required

  VLESS 用户 ID。

VMessInboundOptions.multiplex: 参阅 [多路复用](/zh/configuration/shared/multiplex#入站)。

VMessInboundOptions.transport: V2Ray 传输配置，参阅 [V2Ray 传输层](/zh/configuration/shared/v2ray-transport/)。

VMessInboundOptions.users: |-
  @required

  VMess 用户。

  | Alter ID | 描述    |
  |----------|-------|
  | 0        | 禁用旧协议 |
  | > 0      | 启用旧协议 |

  @warning:

      提供旧协议支持（VMess MD5 身份验证）仅出于兼容性目的，不建议使用 alterId > 1。

_HTTPInboundOptions.set_system_proxy: |-
  @quote:

      仅支持 Linux、Android、Windows 和 macOS。

  @warning:

      要在无特权的 Android 和 iOS 上工作，请改用 tun.platform.http_proxy。

  启动时自动设置系统代理，停止时自动清理。

_HTTPInboundOptions.users: |-
  HTTP 用户

  如果为空则不需要验证。

_HTTPInboundOptions.version: |-
  @since 1.15.0

  提供的 HTTP 版本列表。

  可用值：`1`、`2`、`3`。

  默认为 `1` 和 `2`。

  `3` 需要 TLS。

_SnellInboundOptions.obfs_mode: |-
  @indicator: 仅版本 5

  HTTP 混淆模式，`none` `http` 之一。

  默认为 `none`。

_SnellInboundOptions.version: |-
  @required

  Snell 协议版本，`5` `6` 之一。

  版本 `5` 支持 HTTP 混淆（`obfs_mode`）；版本 `6` 以流量整形（`mode`）取而代之，并要求
  `psk` 长度为 12 到 255 字节。

  @note

      由于我们有意不支持 Snell v5 的 QUIC 代理模式，v5 的线路协议实际上与 v4 没有区别，
      因此不提供独立的 v4 服务器和 v5 客户端。
