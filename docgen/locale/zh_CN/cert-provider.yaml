ACMECertificateProviderOptions.account_key: |-
  现有 ACME 帐户的 PEM 编码私钥。

  @Since 1.14.0

ACMECertificateProviderOptions.alternative_http_port: 用于 ACME HTTP 质询的备用端口；如果非空，将使用此端口而不是 80 来启动 HTTP 质询的侦听器。

ACMECertificateProviderOptions.alternative_tls_port: 用于 ACME TLS-ALPN 质询的备用端口； 系统必须将 443 转发到此端口以使质询成功。

ACMECertificateProviderOptions.data_directory: |-
  ACME 数据存储目录。

  如果为空则使用 `$XDG_DATA_HOME/certmagic|$HOME/.local/share/certmagic`。

ACMECertificateProviderOptions.default_server_name: 如果 ClientHello 的 ServerName 字段为空，则选择证书时要使用的服务器名称。

ACMECertificateProviderOptions.disable_http_challenge: 禁用所有 HTTP 质询。

ACMECertificateProviderOptions.disable_tls_alpn_challenge: 禁用所有 TLS-ALPN 质询。

ACMECertificateProviderOptions.dns01_challenge: |-
  ACME DNS01 质询字段。如果配置，将禁用其他质询方法。

  参阅 [DNS01 质询字段](/zh/configuration/shared/dns01_challenge/)。

ACMECertificateProviderOptions.domain: |-
  域名列表。

  @Required

ACMECertificateProviderOptions.email: 创建或选择现有 ACME 服务器帐户时使用的电子邮件地址。

ACMECertificateProviderOptions.external_account: |-
  EAB（外部帐户绑定）包含将 ACME 帐户绑定或映射到 CA 已知的其他帐户所需的信息。

  外部帐户绑定用于将 ACME 帐户与非 ACME 系统中的现有帐户相关联，例如 CA 客户数据库。

  为了启用 ACME 帐户绑定，运行 ACME 服务器的 CA 需要使用 ACME 之外的某种机制向 ACME 客户端提供 MAC 密钥和密钥标识符。§7.3.4

ACMECertificateProviderOptions.http_client: |-
  用于所有提供者 HTTP 请求的 HTTP 客户端。

  参阅 [HTTP 客户端字段](/zh/configuration/shared/http-client/) 了解详情。

  @Since 1.14.0

ACMECertificateProviderOptions.key_type: |-
  为新证书生成的私钥类型。

  | 值         | 类型      |
  |-----------|----------|
  | `ed25519` | Ed25519 |
  | `p256`    | P-256   |
  | `p384`    | P-384   |
  | `rsa2048` | RSA     |
  | `rsa4096` | RSA     |

  @Since 1.14.0

ACMECertificateProviderOptions.profile: |-
  用于证书签发的 ACME profile。

  当为空且 `provider` 为 Let's Encrypt 时，如果任意域名为 IP 地址，将自动使用 `shortlived`。

  @Since 1.14.0

ACMECertificateProviderOptions.provider: |-
  要使用的 ACME CA 提供商。

  | 值                  | 提供商           |
  |--------------------|---------------|
  | `letsencrypt (默认)` | Let's Encrypt |
  | `zerossl`          | ZeroSSL       |
  | `https://...`      | 自定义           |

  当 `provider` 为 `zerossl` 时，如果设置了 `email` 且未设置 `external_account`，
  sing-box 会自动向 ZeroSSL 请求 EAB 凭据。

  当 `provider` 为 `zerossl` 时，必须至少设置 `external_account`、`email` 或 `account_key` 之一。

ACMEExternalAccountOptions.external_account.key_id: 密钥标识符。

ACMEExternalAccountOptions.external_account.mac_key: MAC 密钥。

CloudflareOriginCACertificateProviderOptions.api_token: |-
  用于创建证书的 Cloudflare API Token。

  可在 [Cloudflare Dashboard > My Profile > API Tokens](https://dash.cloudflare.com/profile/api-tokens) 获取或创建。

  需要 `Zone / SSL and Certificates / Edit` 权限。

  与 `origin_ca_key` 冲突。

CloudflareOriginCACertificateProviderOptions.data_directory: |-
  保存签发证书、私钥和元数据的根目录。

  如果为空，sing-box 会使用与 ACME 证书提供者相同的默认数据目录：
  `$XDG_DATA_HOME/certmagic` 或 `$HOME/.local/share/certmagic`。

CloudflareOriginCACertificateProviderOptions.domain: |-
  要写入证书的域名或通配符域名列表。

  @Required

CloudflareOriginCACertificateProviderOptions.http_client: |-
  用于所有提供者 HTTP 请求的 HTTP 客户端。

  参阅 [HTTP 客户端字段](/zh/configuration/shared/http-client/) 了解详情。

CloudflareOriginCACertificateProviderOptions.origin_ca_key: |-
  Cloudflare Origin CA Key。

  可在 [Cloudflare Dashboard > My Profile > API Tokens > API Keys > Origin CA Key](https://dash.cloudflare.com/profile/api-tokens) 获取。

  与 `api_token` 冲突。

CloudflareOriginCACertificateProviderOptions.request_type: |-
  向 Cloudflare 请求的签名类型。

  | 值                   | 类型        |
  |----------------------|-------------|
  | `origin-rsa`         | RSA         |
  | `origin-ecc`         | ECDSA P-256 |

  如果为空，使用 `origin-rsa`。

CloudflareOriginCACertificateProviderOptions.requested_validity: |-
  请求的证书有效期，单位为天。

  可用值：`7`、`30`、`90`、`365`、`730`、`1095`、`5475`。

  如果为空，使用 `5475` 天（15 年）。

TailscaleCertificateProviderOptions.endpoint: |-
  要复用的 [Tailscale 端点](/zh/configuration/endpoint/tailscale/) 的标签。

  必须在 Tailscale 管理控制台中启用 [MagicDNS 和 HTTPS](https://tailscale.com/kb/1153/enabling-https)。

  @Required
