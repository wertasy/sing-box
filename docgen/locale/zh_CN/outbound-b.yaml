AbstractSnellOutboundOptions.network: |-
  启用的网络协议。

  `tcp` 或 `udp`。

  默认所有。

AbstractSnellOutboundOptions.reuse: 启用连接复用（Snell v2 `CONNECT` 命令）。

AbstractSnellOutboundOptions.userkey: 用户密钥，用于向多用户服务器进行认证。

Hysteria2OutboundOptions.bbr_profile: |-
  @since 1.14.0

  BBR 拥塞控制算法配置，可选 `conservative` `standard` `aggressive`。

  默认使用 `standard`。

Hysteria2OutboundOptions.brutal_debug: 启用 Hysteria Brutal CC 的调试信息日志记录。

Hysteria2OutboundOptions.disable_chrome_parrot: |-
  @since 1.14.0

  禁用 Chrome QUIC 指纹模仿。

  如果没有禁用，客户端的 QUIC 握手将被构造为模仿 Chrome，使 Hysteria 流量更难通过握手指纹识别。

  为了与 Chrome 一致，客户端使用 Chrome 自己的 QUIC 参数，其覆盖部分设置：
  `idle_timeout` 固定为 30 秒，`max_concurrent_streams` 与 `initial_packet_size` 被替换为 Chrome 的值，
  接收窗口从 Chrome 的初始值开始，再增长到配置的最大值。

  @warning:

      Chrome 不声明支持 Ed25519，因此使用 Ed25519 证书的服务端将无法完成握手。
      请改用 ECDSA 或 RSA 证书。

Hysteria2OutboundOptions.hop_interval: |-
  @since 1.11.0

  端口跳跃间隔。

  默认使用 `30s`。

Hysteria2OutboundOptions.hop_interval_max: |-
  @since 1.14.0

  最大端口跳跃间隔，用于随机化。

  如果设置，实际跳跃间隔将在 `hop_interval` 和 `hop_interval_max` 之间随机选择。

Hysteria2OutboundOptions.network: |-
  启用的网络协议。

  `tcp` 或 `udp`。

  默认所有。

Hysteria2OutboundOptions.obfs.max_packet_size: |-
  @since 1.14.0

  最大线上数据包大小（字节）。仅限 Gecko。

  默认使用 `1200`。

Hysteria2OutboundOptions.obfs.min_packet_size: |-
  @since 1.14.0

  最小线上数据包大小（字节）。仅限 Gecko。

  默认使用 `512`。

Hysteria2OutboundOptions.obfs.password: QUIC 流量混淆器密码。

Hysteria2OutboundOptions.obfs.type: |-
  QUIC 流量混淆器类型，可选 `salamander` `gecko`。

  如果为空则禁用。

Hysteria2OutboundOptions.password: 认证密码。

Hysteria2OutboundOptions.realm: |-
  @since 1.14.0

  通过 Hysteria Realm 会合服务连接 Hysteria2 服务器。

  与 `server`、`server_port` 和 `server_ports` 冲突。

  TLS SNI 默认使用 `server_url` 中的主机名。需设置 `tls.server_name` 以匹配 Hysteria2 服务器证书覆盖的名字。

  会合服务参阅 [Hysteria Realm](/zh/configuration/service/hysteria-realm/)。

Hysteria2OutboundOptions.realm.http_client: |-
  与 realm 通信使用的 HTTP 客户端。

  参阅 [HTTP 客户端](/zh/configuration/shared/http-client/) 了解详情。

Hysteria2OutboundOptions.realm.ip_version: |-
  将 realm 连接（STUN、打洞与最终的 QUIC 路径）限制为单一 IP 版本。

  `4` 或 `6`。默认使用两者。

Hysteria2OutboundOptions.realm.port_mapping: |-
  通过 UPnP 或 NAT-PMP 在本地网关上维护 UDP 端口映射。

  可在支持的网关后提升打洞成功率。

  需要 IPv4：与 `"ip_version": 6` 冲突。

Hysteria2OutboundOptions.realm.port_mapping.enabled: 启用端口映射。

Hysteria2OutboundOptions.realm.port_mapping.lifetime: |-
  映射的租约时长。

  默认使用 `10m`。

Hysteria2OutboundOptions.realm.port_mapping.timeout: |-
  网关发现与映射操作的超时。

  默认使用 `10s`。

Hysteria2OutboundOptions.realm.realm_id: |-
  @required

  目标 Hysteria2 服务器注册时使用的相同槽位标识符。

Hysteria2OutboundOptions.realm.server_url: |-
  @required

  Realm 会合服务 URL。

Hysteria2OutboundOptions.realm.stun_servers: |-
  @required

  用于发现本客户端公网地址的 STUN 服务器列表（`host` 或 `host:port`）。

  域名通过 [拨号字段](/zh/configuration/shared/dial/) 中的 [`domain_resolver`](/zh/configuration/shared/dial/#domain_resolver) 解析。

Hysteria2OutboundOptions.realm.token: Realm 的 Bearer 令牌，需与 realm 上配置的 `users[].token` 之一匹配。

Hysteria2OutboundOptions.server: |-
  @required

  服务器地址。

  与 `realm` 冲突。

Hysteria2OutboundOptions.server_port: |-
  @required

  服务器端口。

  如果设置了 `server_ports`，则忽略此项。

  与 `realm` 冲突。

Hysteria2OutboundOptions.server_ports: |-
  @since 1.11.0

  服务器端口范围列表。

  与 `server_port` 和 `realm` 冲突。

Hysteria2OutboundOptions.tls: |-
  @required

  TLS 配置, 参阅 [TLS](/zh/configuration/shared/tls/#出站)。

Hysteria2OutboundOptions.up_down_mbps: |-
  最大带宽。

  如果为空，将使用 BBR 拥塞控制算法而不是 Hysteria CC。

HysteriaOutboundOptions.auth: base64 编码的认证密码。

HysteriaOutboundOptions.auth_str: 认证密码。

HysteriaOutboundOptions.disable_mtu_discovery: |-
  @failure: 已在 sing-box 1.14.0 废弃

      请使用 QUIC 字段 `disable_path_mtu_discovery` 代替。

HysteriaOutboundOptions.hop_interval: |-
  @since 1.12.0

  端口跳跃间隔。

  默认使用 `30s`。

HysteriaOutboundOptions.network: |-
  启用的网络协议。

  `tcp` 或 `udp`。

  默认所有。

HysteriaOutboundOptions.obfs: 混淆密码。

HysteriaOutboundOptions.recv_window: |-
  @failure: 已在 sing-box 1.14.0 废弃

      请使用 QUIC 字段 `connection_receive_window` 代替。

HysteriaOutboundOptions.recv_window_conn: |-
  @failure: 已在 sing-box 1.14.0 废弃

      请使用 QUIC 字段 `stream_receive_window` 代替。

HysteriaOutboundOptions.server_ports: |-
  @since 1.12.0

  服务器端口范围列表。

  与 `server_port` 冲突。

HysteriaOutboundOptions.tls: |-
  @required

  TLS 配置, 参阅 [TLS](/zh/configuration/shared/tls/#出站)。

HysteriaOutboundOptions.up_down: |-
  @required

  格式： `[Integer] [Unit]` 例如： `100 Mbps, 640 KBps, 2 Gbps`

  支持的单位 (大小写敏感, b = bits, B = bytes, 8b=1B)：

      bps (bits per second)
      Bps (bytes per second)
      Kbps (kilobits per second)
      KBps (kilobytes per second)
      Mbps (megabits per second)
      MBps (megabytes per second)
      Gbps (gigabits per second)
      GBps (gigabytes per second)
      Tbps (terabits per second)
      TBps (terabytes per second)

HysteriaOutboundOptions.up_down_mbps: |-
  @required

  以 Mbps 为单位的 `up, down`。

ShadowsocksOutboundOptions.method: |-
  @required

  加密方法：

  * `2022-blake3-aes-128-gcm`
  * `2022-blake3-aes-256-gcm`
  * `2022-blake3-chacha20-poly1305`
  * `none`
  * `aes-128-gcm`
  * `aes-192-gcm`
  * `aes-256-gcm`
  * `chacha20-ietf-poly1305`
  * `xchacha20-ietf-poly1305`

  旧加密方法：

  * `aes-128-ctr`
  * `aes-192-ctr`
  * `aes-256-ctr`
  * `aes-128-cfb`
  * `aes-192-cfb`
  * `aes-256-cfb`
  * `rc4-md5`
  * `chacha20-ietf`
  * `xchacha20`

ShadowsocksOutboundOptions.multiplex: 参阅 [多路复用](/zh/configuration/shared/multiplex#出站)。

ShadowsocksOutboundOptions.network: |-
  启用的网络协议

  `tcp` 或 `udp`。

  默认所有。

ShadowsocksOutboundOptions.password: |-
  @required

  Shadowsocks 密码。

ShadowsocksOutboundOptions.plugin: |-
  Shadowsocks SIP003 插件，由内部实现。

  仅支持 `obfs-local` 和 `v2ray-plugin`。

ShadowsocksOutboundOptions.plugin_opts: Shadowsocks SIP003 插件参数。

ShadowsocksOutboundOptions.udp_over_tcp: |-
  UDP over TCP 配置。

  参阅 [UDP Over TCP](/zh/configuration/shared/udp-over-tcp/)。

  与 `multiplex` 冲突。

TUICOutboundOptions.congestion_control: |-
  QUIC 拥塞控制算法

  可选值: `cubic`, `new_reno`, `bbr`

  默认使用 `cubic`。

TUICOutboundOptions.heartbeat: 发送心跳包以保持连接存活的时间间隔

TUICOutboundOptions.network: |-
  启用的网络协议。

  `tcp` 或 `udp`。

  默认所有。

TUICOutboundOptions.password: TUIC 用户密码

TUICOutboundOptions.tls: |-
  @required

  TLS 配置, 参阅 [TLS](/zh/configuration/shared/tls/#出站)。

TUICOutboundOptions.udp_over_stream: |-
  这是 TUIC 的 [UDP over TCP 协议](/zh/configuration/shared/udp-over-tcp/) 移植， 旨在提供 TUIC 不提供的 基于 QUIC 流的 UDP 中继模式。 由于它是一个附加协议，因此您需要使用 sing-box 或其他兼容的程序作为服务器。

  此模式在正确的 UDP 代理场景中没有任何积极作用，仅适用于中继流式 UDP 流量（基本上是 QUIC 流）。

  与 `udp_relay_mode` 冲突。

TUICOutboundOptions.udp_relay_mode: |-
  UDP 包中继模式

  | 模式     | 描述                           |
  |--------|------------------------------|
  | native | 原生 UDP                       |
  | quic   | 使用 QUIC 流的无损 UDP 中继，引入了额外的开销 |

  与 `udp_over_stream` 冲突。

TUICOutboundOptions.uuid: |-
  @required

  TUIC 用户 UUID

TUICOutboundOptions.zero_rtt_handshake: |-
  在客户端启用 0-RTT QUIC 连接握手
  这对性能影响不大，因为协议是完全复用的

  @warning:

      强烈建议禁用此功能，因为它容易受到重放攻击。
      请参阅 [Attack of the clones](https://blog.cloudflare.com/even-faster-connection-establishment-with-quic-0-rtt-resumption/#attack-of-the-clones)

_SnellOutboundOptions.mode: |-
  @indicator: 仅版本 6

  流量整形模式，`default` `unshaped` `unsafe-raw` 之一。

  默认为 `default`。

_SnellOutboundOptions.obfs_host: |-
  @indicator: 仅版本 4

  `obfs_mode` 为 `http` 时发送的 HTTP `Host` 头。

  默认为 `bing.com`。

_SnellOutboundOptions.obfs_mode: |-
  @indicator: 仅版本 4

  HTTP 混淆模式，`none` `http` 之一。

  默认为 `none`。

_SnellOutboundOptions.psk: |-
  @required

  预共享密钥。

_SnellOutboundOptions.version: |-
  @required

  Snell 协议版本，`4` `6` 之一。

  版本 `4` 支持 HTTP 混淆（`obfs_mode` / `obfs_host`）；版本 `6` 以流量整形（`mode`）
  取而代之，并要求 `psk` 长度为 12 到 255 字节。

  @note

      由于我们有意不支持 Snell v5 的 QUIC 代理模式，v5 的线路协议实际上与 v4 没有区别，
      因此不提供独立的 v4 服务器和 v5 客户端。
