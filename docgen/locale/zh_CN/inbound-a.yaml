ShadowTLSInboundOptions.handshake: |-
  握手服务器地址和 [拨号参数](/zh/configuration/shared/dial/)。

  @Required

ShadowTLSInboundOptions.handshake_for_server_name: |-
  对于特定服务器名称的握手服务器地址和 [拨号参数](/zh/configuration/shared/dial/)。

  仅在 ShadowTLS 协议版本 2/3 中可用。

  @Required

ShadowTLSInboundOptions.password: |-
  ShadowTLS 密码。

  仅在 ShadowTLS 协议版本 2 中可用。

ShadowTLSInboundOptions.strict_mode: |-
  ShadowTLS 严格模式。

  仅在 ShadowTLS 协议版本 3 中可用。

ShadowTLSInboundOptions.users: |-
  ShadowTLS 用户。

  仅在 ShadowTLS 协议版本 3 中可用。

ShadowTLSInboundOptions.version: |-
  ShadowTLS 协议版本。

  | 值             | 协议版本                                                                                    |
  |---------------|-----------------------------------------------------------------------------------------|
  | `1` (default) | [ShadowTLS v1](https://github.com/ihciah/shadow-tls/blob/master/docs/protocol-en.md#v1) |
  | `2`           | [ShadowTLS v2](https://github.com/ihciah/shadow-tls/blob/master/docs/protocol-en.md#v2) |
  | `3`           | [ShadowTLS v3](https://github.com/ihciah/shadow-tls/blob/master/docs/protocol-v3-en.md) |

ShadowTLSInboundOptions.wildcard_sni: |-
  ShadowTLS 通配符 SNI 模式。

  可用值：

  * `off`：（默认）禁用。
  * `authed`：已认证的连接的目标将被重写为 `(servername):443`。
  * `all`：所有连接的目标将被重写为 `(servername):443`。

  此外，匹配 `handshake_for_server_name` 的连接不受影响。

  仅在 ShadowTLS 协议 3 中可用。

  @Since 1.12.0

TrojanInboundOptions.fallback: |-
  回退服务器配置。如果 `fallback` 和 `fallback_for_alpn` 为空，则禁用回退。

  @Failure:

      没有证据表明 GFW 基于 HTTP 响应检测并阻止 Trojan 服务器，并且在服务器上打开标准 http/s 端口是一个更大的特征。

TrojanInboundOptions.fallback_for_alpn: |-
  为 ALPN 指定回退服务器配置。

  如果不为空，ALPN 不在此列表中的 TLS 回退请求将被拒绝。

TrojanInboundOptions.multiplex: 参阅 [多路复用](/zh/configuration/shared/multiplex#入站)。

TrojanInboundOptions.tls: TLS 配置，参阅 [TLS](/zh/configuration/shared/tls/#入站)。

TrojanInboundOptions.transport: V2Ray 传输配置，参阅 [V2Ray 传输层](/zh/configuration/shared/v2ray-transport/)。

TrojanInboundOptions.users: |-
  Trojan 用户。

  @Required

TunInboundOptions.address: |-
  tun 接口的 IPv4 和 IPv6 前缀。

  @Since 1.10.0

  @Required

TunInboundOptions.auto_redirect: |-
  通过使用 nftables 改善 TUN 路由和性能。

  在 Linux 上始终推荐使用 `auto_redirect`，它提供更好的路由、更高的性能（优于 tproxy），并避免了 TUN 和 Docker 桥接网络之间的冲突。

  预匹配需要内核支持 nfqueue（`nfnetlink_queue`）。

  `auto_redirect` 在 Android 上通过图形客户端的 root 服务或 root shell 得到完整支持，包括转发流量（热点、中继器）。

  `auto_redirect` 还会自动将兼容性规则插入 OpenWrt 的 fw4 表中，即无需额外配置即可在路由器上工作。

  与 `route.default_mark` 和 `[dialOptions].routing_mark` 冲突。

  @Since 1.10.0

  @Quote:

      仅支持 Linux，且需要 `auto_route` 已启用。

TunInboundOptions.auto_redirect_input_mark: |-
  `auto_redirect` 使用的连接输入标记。

  默认使用 `0x2023`（Android 上为 `0x400000`）。

  @Since 1.10.0

TunInboundOptions.auto_redirect_iproute2_fallback_rule_index: |-
  `auto_redirect` 生成的 iproute2 回退规则索引。

  此规则在系统默认规则（32766: main，32767: default）之后检查，
  仅当系统路由表中未找到路由时才将流量路由到 sing-box 路由表。

  @Since 1.12.18

TunInboundOptions.auto_redirect_nfqueue: |-
  `auto_redirect` 预匹配使用的 NFQueue 编号。

  @Since 1.13.0

TunInboundOptions.auto_redirect_output_mark: |-
  `auto_redirect` 使用的连接输出标记。

  默认使用 `0x2024`（Android 上为 `0x200000`）。

  @Since 1.10.0

TunInboundOptions.auto_redirect_reset_mark: |-
  `auto_redirect` 预匹配使用的连接重置标记。

  默认使用 `0x2025`（Android 上为 `0x600000`）。

  @Since 1.13.0

TunInboundOptions.auto_redirect_tproxy_mark: |-
  `auto_redirect` iptables 后端为 IPv6 TCP 使用的连接 TPROXY 标记。

  默认使用 `0x2026`（Android 上为 `0x800000`）。

  @Since 1.15.0

TunInboundOptions.auto_route: |-
  设置到 Tun 的默认路由。

  @Quote:

      为避免流量环回，请设置 `route.auto_detect_interface` 或 `route.default_interface` 或 `outbound.bind_interface`。

  @Note: 与 Android VPN 一起使用

      VPN 默认优先于 tun。要使 tun 经过 VPN，启用 `route.override_android_vpn`。

  @Note: 也启用 `auto_redirect`

    在 Linux 上始终推荐使用 `auto_redirect`，它提供更好的路由， 更高的性能（优于 tproxy）， 并避免 TUN 与 Docker 桥接网络冲突。

TunInboundOptions.dns_address: |-
  [`dns_mode`](#dns_mode) 使用的 DNS 服务器地址列表。

  未设置时，使用 [`address`](#address) 中第一个 IPv4 和 IPv6 条目的下一个地址，
  发往该地址的连接按 [`hijack-dns`](/zh/configuration/route/rule_action/#hijack-dns) 路由动作处理。

  设置后，请配置 [`hijack-dns`](/zh/configuration/route/rule_action/#hijack-dns)
  路由规则以处理发往这些地址的 DNS 流量。

  @Since 1.14.0

TunInboundOptions.dns_mode: |-
  TUN 接口上 DNS 的处理方式。

  | 模式       | 描述                                                                                                  |
  |------------|-------------------------------------------------------------------------------------------------------|
  | `disabled` | 不设置原生 DNS，也不劫持 DNS 流量。                                                                    |
  | `native`   | 尽可能设置平台的原生接口 DNS：Windows 与 Apple 上的接口 DNS，Linux 上的 `systemd-resolved` 接口 DNS。   |
  | `hijack`   | 与 `native` 相同，并额外执行下文所述的 53 端口劫持。                                                  |

  启用 [`auto_route`](#auto_route) 时默认使用 `hijack`，否则默认使用 `disabled`。

  `hijack` 在 `native` 之上额外执行：

  *Linux*：发往本机接口地址（如 `127.0.0.53` 或本机 LAN 接口 IP）的 DNS 不会被劫持。

  - 未启用 `auto_redirect` 时：发往直连子网的 53 端口流量也会经由 TUN 路由。
  - 启用 `auto_redirect` 时：53 端口流量被重定向至
    [`dns_address`](#dns_address)。

  *Windows 启用 [`strict_route`](#strict_route) 时*：阻止经由非 TUN 接口的 53 端口流量。

  @Since 1.14.0

TunInboundOptions.endpoint_independent_nat: |-
  此选项自 sing-box 1.11.0 起不再生效，可从配置中移除。

  自 sing-box 1.14.0 起，可使用 [UDP NAT 字段](/zh/configuration/shared/udp-nat/)自定义映射和过滤行为。

TunInboundOptions.exclude_interface: |-
  排除路由的接口。

  与 `include_interface` 冲突。

  @Warning:

      当 `strict_route` 启用，到被排除接口的回程流量将不会被自动排除，因此也要添加它们（例：`br-lan` 与 `pppoe-wan`）。

TunInboundOptions.exclude_mac_address: |-
  排除路由的 MAC 地址。

  与 `include_mac_address` 冲突。

  @Since 1.14.0

  @Quote:

      仅支持 Linux，且需要 `auto_route` 和 `auto_redirect` 已启用。

TunInboundOptions.exclude_mptcp: |-
  由于协议限制，MPTCP 无法被透明代理。

  此类流量通常由 Apple 系统创建。

  启用时，MPTCP 连接将绕过 sing-box 直接连接，否则，将被拒绝以避免错误。

  @Since 1.13.0

  @Quote:

      仅支持 Linux，且需要 nftables，`auto_route` 和 `auto_redirect` 已启用。

TunInboundOptions.exclude_package: 排除路由的 Android 应用包名。

TunInboundOptions.exclude_uid: 排除路由的用户。

TunInboundOptions.exclude_uid_range: 排除路由的用户范围。

TunInboundOptions.gso: |-
  启用通用分段卸载。

  @Failure: 已在 sing-box 1.11.0 废弃

      GSO 对于透明代理场景没有优势，已废弃和不再生效，且将在 sing-box 1.12.0 中被移除。

  @Since 1.8.0

  @Quote:

      仅支持 Linux。

TunInboundOptions.include_android_user: |-
  限制被路由的 Android 用户。

  | 常用用户 | ID |
