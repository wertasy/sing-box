InboundOptions.domain_strategy: |-
  可选值： `prefer_ipv4` `prefer_ipv6` `ipv4_only` `ipv6_only`。

  如果设置，请求的域名将在路由之前解析为 IP。

  如果 `sniff_override_destination` 生效，它的值将作为后备。

  @Failure: 已在 sing-box 1.11.0 废弃

      入站字段已废弃且将在 sing-box 1.12.0 中被移除，参阅 [迁移指南](/zh/migration/#迁移旧的入站字段到规则动作).

InboundOptions.sniff: |-
  启用协议探测。

  参阅 [协议探测](/zh/configuration/route/sniff/)

  @Failure: 已在 sing-box 1.11.0 废弃

      入站字段已废弃且将在 sing-box 1.12.0 中被移除，参阅 [迁移指南](/zh/migration/#迁移旧的入站字段到规则动作).

InboundOptions.sniff_override_destination: |-
  用探测出的域名覆盖连接目标地址。

  如果域名无效（如 Tor），将不生效。

  @Failure: 已在 sing-box 1.11.0 废弃

      入站字段已废弃且将在 sing-box 1.12.0 中被移除。

InboundOptions.sniff_timeout: |-
  探测超时时间。

  @Failure: 已在 sing-box 1.11.0 废弃

      入站字段已废弃且将在 sing-box 1.12.0 中被移除，参阅 [迁移指南](/zh/migration/#迁移旧的入站字段到规则动作).

InboundOptions.udp_disable_domain_unmapping: |-
  如果启用，对于地址为域的 UDP 代理请求，将在响应中发送原始包地址而不是映射的域。

  此选项用于兼容不支持接收带有域地址的 UDP 包的客户端，如 Surge。

  @Failure: 已在 sing-box 1.11.0 废弃

      入站字段已废弃且将在 sing-box 1.12.0 中被移除，参阅 [迁移指南](/zh/migration/#迁移旧的入站字段到规则动作).

ListenOptions.bind_interface: |-
  要绑定到的网络接口。

  @Since 1.12.0

ListenOptions.detour: |-
  如果设置，连接将被转发到指定的入站。

  需要目标入站支持，参阅 [注入支持](/zh/configuration/inbound/#字段)。

ListenOptions.disable_tcp_keep_alive: |-
  禁用 TCP keep alive。

  @Since 1.13.0

ListenOptions.domain_strategy: |-
  可选值： `prefer_ipv4` `prefer_ipv6` `ipv4_only` `ipv6_only`。

  如果设置，请求的域名将在路由之前解析为 IP。

  如果 `sniff_override_destination` 生效，它的值将作为后备。

  @Failure: 已在 sing-box 1.11.0 废弃

      入站字段已废弃且将在 sing-box 1.12.0 中被移除，参阅 [迁移指南](/zh/migration/#迁移旧的入站字段到规则动作).

ListenOptions.listen: |-
  监听地址。

  @Required

ListenOptions.listen_port: 监听端口。

ListenOptions.netns: |-
  设置网络命名空间，名称或路径。

  自 sing-box 1.14.0 起，也可以使用[网络命名空间](/zh/configuration/network-namespace/)的标签。

  @Since 1.12.0

  @Quote:

      仅支持 Linux。

ListenOptions.reuse_addr: |-
  重用监听地址。

  @Since 1.12.0

ListenOptions.routing_mark: |-
  设置 netfilter 路由标记。

  支持数字 (如 `1234`) 和十六进制字符串 (如 `"0x1234"`)。

  @Since 1.12.0

  @Quote:

      仅支持 Linux。

ListenOptions.sniff: |-
  启用协议探测。

  参阅 [协议探测](/zh/configuration/route/sniff/)

  @Failure: 已在 sing-box 1.11.0 废弃

