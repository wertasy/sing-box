ListenOptions.tcp_fast_open: 启用 TCP Fast Open。

ListenOptions.tcp_keep_alive: |-
  TCP keep alive 初始周期。

  @Since 1.13.0

      默认值从 `10m` 更改为 `5m`。

ListenOptions.tcp_keep_alive_interval: |-
  TCP keep alive 间隔。

ListenOptions.tcp_multi_path: |-
  启用 TCP Multi Path。

  @Warning:

      需要 Go 1.21。

