RawRouteOptionsActionOptions.tls_fragment: |-
  @since 1.12.0

  通过分段 TLS 握手数据包来绕过防火墙检测。

  此功能旨在规避基于**明文数据包匹配**的简单防火墙，不应该用于规避真的审查。

  由于性能不佳，请首先尝试 `tls_record_fragment`，且仅应用于已知被阻止的服务器名称。

  在 Linux、Apple 平台和需要管理员权限的 Windows 系统上，可自动检测等待时间。
  若无法自动检测，将回退使用 `tls_fragment_fallback_delay` 指定的固定等待时间。

  此外，若实际等待时间小于 20 毫秒，同样会回退至固定等待时间模式，因为此时判定目标处于本地或透明代理之后。

RawRouteOptionsActionOptions.tls_fragment_fallback_delay: |-
  @since 1.12.0

  当 TLS 分片功能无法自动判定等待时间时使用的回退值。

  默认使用 `500ms`。

RawRouteOptionsActionOptions.tls_record_fragment: |-
  @since 1.12.0

  通过分段 TLS 握手数据包到多个 TLS 记录来绕过防火墙检测。

RawRouteOptionsActionOptions.tls_spoof: |-
  @since 1.14.0

  @quote:

      仅支持 Linux、macOS 和 Windows，需要提升的权限。

  在真实 ClientHello 之前注入携带本字段所指定 SNI 的伪造 TLS ClientHello，
  用于欺骗仅放行特定主机名的 SNI 过滤中间盒。

  详情与所需权限参阅出站 TLS [`spoof`](/zh/configuration/shared/tls/#spoof)。

RawRouteOptionsActionOptions.tls_spoof_method: |-
  @since 1.14.0

  控制伪造报文被真实服务器拒绝的方式。完整取值表与平台说明参阅出站 TLS
  [`spoof_method`](/zh/configuration/shared/tls/#spoof_method)。

RawRouteOptionsActionOptions.udp_connect: 如果启用，将尝试将 UDP 连接 connect 到目标而不是 listen。

RawRouteOptionsActionOptions.udp_disable_domain_unmapping: |-
  如果启用，对于地址为域的 UDP 代理请求，将在响应中发送原始包地址而不是映射的域。

  此选项用于兼容不支持接收带有域地址的 UDP 包的客户端，如 Surge。

RawRouteOptionsActionOptions.udp_timeout: |-
  UDP 连接超时时间。

  设置比入站 UDP 超时更大的值将无效。

  已探测协议连接的默认值：

  | 超时    | 协议                   |
  |-------|----------------------|
  | `10s` | `dns`, `ntp`, `stun` |
  | `30s` | `quic`, `dtls`       |

  如果没有探测到协议，以下端口将默认识别为协议：

  | 端口   | 协议     |
  |------|--------|
  | 53   | `dns`  |
  | 123  | `ntp`  |
  | 443  | `quic` |
  | 3478 | `stun` |

