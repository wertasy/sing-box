  如果为空，将尝试从 DNS 加载。

  @Indicator: 仅客户端

OutboundECHOptions.config_path: |2-
  ECH 配置路径，PEM 格式。

  如果为空，将尝试从 DNS 加载。

  @Indicator: 仅客户端

OutboundECHOptions.dynamic_record_sizing_disabled: |2-
  禁用 TLS 记录的自适应大小调整。

  当为 true 时，总是使用最大可能的 TLS 记录大小。
  当为 false 时，可能会调整 TLS 记录的大小以尝试改善延迟。

