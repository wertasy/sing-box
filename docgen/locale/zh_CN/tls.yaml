      `pq_signature_schemes_enabled` 已在 sing-box 1.12.0 废弃且已在 sing-box 1.13.0 中被移除。

OutboundECHOptions.query_server_name: |2-
  覆盖用于 ECH HTTPS 记录查询的域名。

  如果为空，使用 `server_name` 查询。

