InboundACMEOptions.alternative_http_port: |2-

  用于 ACME HTTP 质询的备用端口；如果非空，将使用此端口而不是 80 来启动 HTTP 质询的侦听器。

InboundACMEOptions.alternative_tls_port: |2-

  用于 ACME TLS-ALPN 质询的备用端口； 系统必须将 443 转发到此端口以使质询成功。

InboundACMEOptions.data_directory: |2-

  ACME 数据存储目录。

  如果为空则使用 `$XDG_DATA_HOME/certmagic|$HOME/.local/share/certmagic`。

InboundACMEOptions.default_server_name: |2-

  如果 ClientHello 的 ServerName 字段为空，则选择证书时要使用的服务器名称。

InboundACMEOptions.disable_http_challenge: |2-

  禁用所有 HTTP 质询。

InboundACMEOptions.disable_tls_alpn_challenge: |2-

  禁用所有 TLS-ALPN 质询。

InboundACMEOptions.dns01_challenge: |2-

  ACME DNS01 验证字段。如果配置，将禁用其他验证方法。

  参阅 [DNS01 验证字段](/zh/configuration/shared/dns01_challenge/)。

InboundACMEOptions.domain: |2-

  域名列表。

  如果为空则禁用 ACME。

InboundACMEOptions.email: |2-

  创建或选择现有 ACME 服务器帐户时使用的电子邮件地址。

InboundACMEOptions.external_account: |2-

  EAB（外部帐户绑定）包含将 ACME 帐户绑定或映射到 CA 已知的其他帐户所需的信息。

  外部帐户绑定"用于将 ACME 帐户与非 ACME 系统中的现有帐户相关联，例如 CA 客户数据库。

  为了启用 ACME 帐户绑定，运行 ACME 服务器的 CA 需要使用 ACME 之外的某种机制向 ACME 客户端提供 MAC 密钥和密钥标识符。§7.3.4

InboundACMEOptions.external_account.key_id: |2-

  密钥标识符。

InboundACMEOptions.external_account.mac_key: |2-

  MAC 密钥。

InboundACMEOptions.profile: |2-
  用于证书签发的 ACME 配置文件。

  当为空且 `provider` 为 Let's Encrypt 时，如果任何域名为 IP 地址，将自动使用 `shortlived`。

  @Since 1.14.0

InboundACMEOptions.provider: |2-

  要使用的 ACME CA 供应商。

  | 值                  | 供应商           |
  |--------------------|---------------|
  | `letsencrypt (默认)` | Let's Encrypt |
  | `zerossl`          | ZeroSSL       |
  | `https://...`      | 自定义           |

InboundECHOptions.key: |2-
  ECH 密钥行数组，PEM 格式。

  @Indicator: 仅服务器

InboundECHOptions.key_path: |2-
  ECH 密钥路径，PEM 格式。

  @Indicator: 仅服务器

  @Note:

      文件更改时将自动重新加载。

InboundRealityOptions.handshake: |2-
  握手服务器地址和 [拨号参数](/zh/configuration/shared/dial/)。

  @Indicator: 仅服务器

  @Required

InboundRealityOptions.max_time_difference: |2-
  服务器和客户端之间的最大时间差。

  如果为空则禁用检查。

  @Indicator: 仅服务器

InboundRealityOptions.private_key: |2-
  私钥，由 `sing-box generate reality-keypair` 生成。

  @Indicator: 仅服务器

  @Required

InboundRealityOptions.short_id: |2-
  一个零到八位的十六进制字符串。

  @Required

InboundTLSOptions.alpn: |2-

  支持的应用层协议协商列表，按优先顺序排列。

  如果两个对等点都支持 ALPN，则选择的协议将是此列表中的一个，如果没有相互支持的协议则连接将失败。

  参阅 [Application-Layer Protocol Negotiation](https://en.wikipedia.org/wiki/Application-Layer_Protocol_Negotiation)。

InboundTLSOptions.certificate: |2-

  服务器证书链行数组，PEM 格式。

InboundTLSOptions.certificate_path: |2-
  服务器证书链路径，PEM 格式。

  @Note:

      文件更改时将自动重新加载。

InboundTLSOptions.certificate_provider: |2-
  字符串或对象。

  为字符串时，共享[证书提供者](/zh/configuration/shared/certificate-provider/)的标签。

  为对象时，内联的证书提供者。可用类型和字段参阅[证书提供者](/zh/configuration/shared/certificate-provider/)。

  ## 自定义 TLS 支持

  @Since 1.14.0

  @Indicator: 仅服务器

  @Info: QUIC 支持

      只有 ECH 在 QUIC 中被支持.

InboundTLSOptions.cipher_suites: |2-

  启用的 TLS 1.0–1.2 密码套件列表。列表的顺序被忽略。请注意，TLS 1.3 的密码套件是不可配置的。

  如果为空，则使用安全的默认列表。默认密码套件可能会随着时间的推移而改变。

InboundTLSOptions.client_authentication: |2-
  要使用的客户端身份验证类型。

  可用值：

  * `no`（默认）
  * `request`
  * `require-any`
  * `verify-if-given`
  * `require-and-verify`

  如果此选项设置为 `verify-if-given` 或 `require-and-verify`，
  则需要 `client_certificate`、`client_certificate_path`、`client_certificate_sha256` 或 `client_certificate_public_key_sha256` 中的一个。

  @Since 1.13.0

  @Indicator: 仅服务器

InboundTLSOptions.client_certificate: |2-
  客户端证书链行数组，PEM 格式。

  客户端证书链行数组，PEM 格式。

  @Since 1.13.0

  @Indicator: 仅客户端

  @Since 1.13.0

  @Indicator: 仅服务器

InboundTLSOptions.client_certificate_path: |2-
  客户端证书链路径，PEM 格式。

  客户端证书链路径列表，PEM 格式。

  @Since 1.13.0

  @Indicator: 仅客户端

  @Since 1.13.0

  @Indicator: 仅服务器

  @Note:

      文件更改时将自动重新加载。

InboundTLSOptions.client_certificate_public_key_sha256: |2-
  客户端证书公钥的 SHA-256 哈希列表，base64 格式。

  要生成证书公钥的 SHA-256 哈希，请使用以下命令：

  ```bash
  # 对于证书文件
  openssl x509 -in certificate.pem -pubkey -noout | openssl pkey -pubin -outform der | openssl dgst -sha256 -binary | openssl enc -base64

  # 对于远程服务器的证书
  echo | openssl s_client -servername example.com -connect example.com:443 2>/dev/null | openssl x509 -pubkey -noout | openssl pkey -pubin -outform der | openssl dgst -sha256 -binary | openssl enc -base64
  ```

  @Since 1.13.0

  @Indicator: 仅服务器

InboundTLSOptions.client_certificate_sha256: |2-
  客户端证书的 SHA-256 哈希列表，base64 格式。

  哈希基于整个 DER 编码的证书计算，参阅 [certificate_sha256](#certificate_sha256)。

  @Since 1.15.0

  @Indicator: 仅服务器

InboundTLSOptions.curve_preferences: |2-
  支持的密钥交换机制集合。列表的顺序被忽略，密钥交换机制通过 Golang 的内部偏好顺序从此列表中选择。

  可用值，同时也是默认列表：

  * `P256`
  * `P384`
  * `P521`
  * `X25519`
  * `X25519MLKEM768`

  @Since 1.13.0

InboundTLSOptions.enabled: |2-

  启用 TLS

InboundTLSOptions.handshake_timeout: |2-
  TLS 握手超时，采用 golang 的 Duration 格式。

  @Since 1.14.0

InboundTLSOptions.insecure: |2-
  接受任何服务器证书。

  @Indicator: 仅客户端

InboundTLSOptions.kernel_rx: |2-
  启用内核 TLS 接收支持。

  @Since 1.13.0

  @Quote:

      仅支持 Linux 5.1+，如果可能，使用较新的内核。

  @Quote:

      仅支持 TLS 1.3。

  @Failure:

      即使使用 `splice(2)`，kTLS RX 也肯定会降低性能，因此不建议启用。

InboundTLSOptions.kernel_tx: |2-
  启用内核 TLS 发送支持。

  @Since 1.13.0

  @Quote:

      仅支持 Linux 5.1+，如果可能，使用较新的内核。

  @Quote:

      仅支持 TLS 1.3。

  @Warning:

      kTLS TX 仅当 `splice(2)` 可用时（两端经过握手后必须为没有附加协议的 TCP 或 TLS）才能提高性能；否则肯定会降低性能。

InboundTLSOptions.key: |2-
  服务器 PEM 私钥行数组。

  @Indicator: 仅服务器

  @Note:

      文件更改时将自动重新加载。

InboundTLSOptions.key_path: |2-
  服务器私钥路径，PEM 格式。

  @Indicator: 仅服务器

  @Note:

      文件更改时将自动重新加载。

InboundTLSOptions.max_version: |2-

  可接受的最大 TLS 版本。

  默认情况下，当前最高版本为 TLS 1.3。

InboundTLSOptions.min_version: |2-

  可接受的最低 TLS 版本。

  默认使用 TLS 1.2。

InboundTLSOptions.server_name: |2-

  用于验证返回证书上的主机名，除非设置不安全。

  它还包含在 ClientHello 中以支持虚拟主机，除非它是 IP 地址。

InboundTLSOptionsContainer.tls: TLS 配置, 参阅 [TLS](/zh/configuration/shared/tls/#入站)。

OutboundECHOptions.config: |2-
