RemoteDNSServerOptions.server_port: |-
  DNS 服务器的端口。

  默认使用 `53`。

RemoteHTTPSDNSServerOptions.headers: 发送到 DNS 服务器的额外标头。

RemoteHTTPSDNSServerOptions.path: |-
  DNS 服务器的路径。

  默认使用 `/dns-query`。

RemoteHTTPSDNSServerOptions.server_port: |-
  DNS 服务器的端口。

  默认使用 `443`。

RemoteTLSDNSServerOptions.server_port: |-
  DNS 服务器的端口。

  默认使用 `853`。

ResolvedDNSServerOptions.accept_default_resolvers: |-
  指示是否除了匹配域名外，还应接受默认 DNS 解析器以进行回退查询。

  具体来说，默认 DNS 解析器是设置了 `SetLinkDefaultRoute` 或 `SetLinkDomains ~.` 的 DNS 服务器。

  如果未启用，对于不匹配搜索域或匹配域的请求，将返回 `NXDOMAIN`。

ResolvedDNSServerOptions.service: |-
  @required

  [Resolved 服务](/zh/configuration/service/resolved) 的标签。

TailscaleDNSServerOptions.accept_default_resolvers: |-
  指示是否除了 MagicDNS 外，还应接受默认 DNS 解析器以进行回退查询。

  如果未启用，对于非 Tailscale 域名查询将返回 `NXDOMAIN`。

TailscaleDNSServerOptions.accept_search_domain: |-
  @since 1.14.0

  启用后，单标签查询（例如 `my-device`）将依次附加 Tailscale 搜索域进行重试，直到其中一个解析成功。

TailscaleDNSServerOptions.endpoint: |-
  @required

  [Tailscale 端点](/zh/configuration/endpoint/tailscale) 的标签。

_DNSRuleAction.action: 要执行的动作。默认使用 `route`。

_DNSRuleAction.race: |-
  @since 1.14.0

  仅可用于 `route`、`respond`、`reject` 和 `predefined` 动作。

  需要 [`match_response`](/zh/configuration/dns/rule/#match_response)（对 logical 规则，位于子规则中）。
  与 `speculative` 冲突。

  默认情况下，规则逐条按顺序匹配：带 `match_response` 的规则等待其引用的响应，在它被判定之前不会匹配任何后续规则。

  启用 `race` 的规则成为竞态规则，不再保持这一顺序：其引用的响应尚未到达时，规则匹配会越过它继续进行，因此竞态规则的匹配相互并行、也与后续规则并行。每条竞态规则在其引用的响应可用时被判定，首个匹配的竞态规则立即终止规则评估，其余查询将被取消。

  未启用 `race` 的规则仍严格按顺序生效：只要前面还有未判定的竞态规则，其他已匹配规则的动作就被扣住，直到所有竞态规则均未匹配。

