OpenVPNClientEndpointOptions.system: |-
  使用系统接口。

  需要权限，且不能与现有系统接口冲突。

  禁用时，sing-box 使用内部网络栈。
OpenVPNClientEndpointOptions.name: |-
  系统接口的自定义接口名称。

  默认使用自动生成的 `ovpn` 接口名称。

OpenVPNClientEndpointOptions.mtu: |-
  OpenVPN 接口 MTU。

  为空时使用服务器推送的 MTU；收到服务器配置前使用 `1500`。
OpenVPNClientEndpointOptions.server: |-
  OpenVPN 服务器地址。

  `server` 和 `servers` 之一必填。

  与 `servers` 冲突。
OpenVPNClientEndpointOptions.server_port: |-
  OpenVPN 服务器端口。

  设置 `server` 时必填。
OpenVPNClientEndpointOptions.mode: |-
  OpenVPN 会话模式，可选值为 `tls` 或 `static_key`。

  `static_key` 是已弃用的 OpenVPN 模式，不使用 TLS 控制通道且不提供前向保密。
OpenVPNClientEndpointOptions.network: |-
  默认 OpenVPN 传输网络，可选值为 `udp` 或 `tcp`。

  该值应用于 `server` 和未单独设置 `network` 的 `servers` 条目。
OpenVPNClientEndpointOptions.remote_random: |-
  连接前随机排列 `servers` 顺序。

  默认禁用。
OpenVPNClientEndpointOptions.address: |-
  本地 IPv4 和 IPv6 隧道前缀。

  `static_key` 模式至少需要一个地址。在 TLS 模式下该字段可选，并可被服务器推送的地址替换。
OpenVPNClientEndpointOptions.peer_address: |-
  IPv4 隧道对端地址及 VPN 网关。

  在 `static_key` 模式下配置 IPv4 `address` 时必填。
OpenVPNClientEndpointOptions.peer_address_ipv6: |-
  IPv6 隧道对端地址及 VPN 网关。

  在 `static_key` 模式下配置 IPv6 `address` 时必填。
OpenVPNClientEndpointOptions.topology: |-
  隧道拓扑，可选值为 `net30`、`p2p` 或 `subnet`。

  TLS 模式下为空时使用服务器推送的拓扑。
OpenVPNClientEndpointOptions.username: |-
  OpenVPN 用户名/密码认证的用户名。

  仅在 TLS 模式下可用。
OpenVPNClientEndpointOptions.password: OpenVPN 用户名/密码认证的密码。
OpenVPNClientEndpointOptions.auth_retry: |-
  用户名/密码认证失败后的行为，可选值为 `none`、`nointeract` 或 `interact`。

  默认使用 `none`，并将永久认证失败视为终止错误。

  `nointeract` 和 `interact` 允许重试认证。
OpenVPNClientEndpointOptions.static_challenge: 请求认证响应时显示的静态质询文本。
OpenVPNClientEndpointOptions.static_challenge_echo: 以明文显示静态质询响应。
OpenVPNClientEndpointOptions.static_key: |-
  OpenVPN 静态密钥内容。

  在 `static_key` 模式下必填。

  与 `static_key_path` 冲突。
OpenVPNClientEndpointOptions.static_key_path: |-
  OpenVPN 静态密钥路径。

  在 `static_key` 模式下未设置 `static_key` 时必填。

  与 `static_key` 冲突。
OpenVPNClientEndpointOptions.key_direction: |-
  静态密钥方向，可选值为 `server` 或 `client`。

  为空时双向使用密钥。仅在 `static_key` 模式下可用。
OpenVPNClientEndpointOptions.tls: |-
  在 TLS 模式下必填。

  OpenVPN 控制通道 TLS 配置。
OpenVPNClientEndpointOptions.cipher: |-
  `static_key` 模式使用的数据通道 cipher。

  为空时使用上游静态密钥模式的默认值 `BF-CBC`。静态密钥 cipher 包括
  `BF-CBC`、`CAST5-CBC`、`DES-CBC`、`DES-EDE-CBC`、`DES-EDE3-CBC`、
  AES-CBC、ARIA-CBC、Camellia-CBC 系列，以及 `SEED-CBC`、`SM4-CBC` 和 `NONE`。

  仅在 `static_key` 模式下可用。
OpenVPNClientEndpointOptions.data_ciphers: |-
  允许的 OpenVPN 数据通道 cipher。

  仅在 TLS 模式下可用。

  默认使用 `AES-256-GCM`、`AES-128-GCM` 和 `CHACHA20-POLY1305`。

  AES-GCM 系列还包括 `AES-192-GCM`。保留的 cipher 包括 AES、ARIA、Camellia、DES、Blowfish、CAST5、SEED 和 SM4 的 CBC、CFB、OFB 形式，以及 `NONE`。CFB 和 OFB 仅可用于 TLS 模式。
OpenVPNClientEndpointOptions.data_ciphers_fallback: |-
  用于不支持 cipher 协商的对端的数据通道 cipher。

  默认禁用。

  仅在 TLS 模式下可用。
OpenVPNClientEndpointOptions.auth: |-
  OpenVPN 数据通道认证摘要。

  默认使用 `SHA1`，仅应用于非 AEAD 数据 cipher 和 `tls_auth`。
OpenVPNClientEndpointOptions.mss_fix: |-
  OpenVPN UDP packet 的最大大小，用于限制通过隧道发送的 TCP 连接 MSS。

  为空时使用上游 OpenVPN 默认值：配置了 `fragment` 时使用其值；否则默认 tunnel MTU 使用 `1492`，自定义 tunnel MTU 使用该 MTU。
OpenVPNClientEndpointOptions.mss_fix_disabled: |-
  禁用 MSS 限制，包括默认限制。

  与 `mss_fix` 和 `mss_fix_mode` 冲突。
OpenVPNClientEndpointOptions.mss_fix_mode: |-
  显式 `mss_fix` 的 OpenVPN MSS 计算模式，`mtu` 或 `fixed` 之一。

  空值使用普通的 OpenVPN 封装开销计算。`mtu` 还会计算外层 IP 和 UDP/TCP 传输头；`fixed` 将 `mss_fix` 视为内层 IPv4 数据包大小。

  需要 `mss_fix`。
OpenVPNClientEndpointOptions.fragment: |-
  用于 OpenVPN 数据通道 fragmentation 的最大 OpenVPN UDP packet 大小。

  设为 `0` 时禁用。非零值必须至少为 `68`。

  与 TCP 传输冲突。
OpenVPNClientEndpointOptions.replay_window: UDP 数据通道重放窗口大小。默认使用 `64`，最大值为 `65536`。
OpenVPNClientEndpointOptions.replay_window_time: |-
  UDP 数据通道重放窗口时长。默认使用 `15s`，最大值为 `10m`。

  该值必须使用整秒。
OpenVPNClientEndpointOptions.compression: |-
  OpenVPN `compress` framing 模式，可选值为 `none`、`no`、`lz4`、`lz4-v2`、`stub`、`stub-v2`、`disabled` 或 `off`。

  默认禁用。
OpenVPNClientEndpointOptions.compression_lzo: |-
  OpenVPN `comp-lzo` 模式，可选值为 `none`、`no`、`yes`、`adaptive`、`asym`、`disabled` 或 `off`。

  默认禁用。
OpenVPNClientEndpointOptions.allow_compression: |-
  服务器推送的 compression 策略，可选值为 `no`、`asym` 或 `yes`。

  默认使用 `no`，仅允许 compression stub framing。`asym` 接受来自服务器的 compressed packet，但不压缩出站 packet。`yes` 是 `asym` 的旧别名。

  当设为 `no` 时，与通过 `compression` 或 `compression_lzo` 启用的非 stub compression 冲突。
OpenVPNClientEndpointOptions.route_no_pull: |-
  忽略服务器推送的 route、DNS 和 DHCP 设置、route metric、`redirect-gateway`、
  `redirect-private`、`block-ipv6` 和 `block-outside-dns`。

  默认禁用。
OpenVPNClientEndpointOptions.pull_filters: |-
  服务器推送选项的有序 pull filter 列表。

  应用第一个 `text` 为完整推送选项大小写敏感前缀的 filter。未匹配任何 filter 的选项会被接受。
OpenVPNClientEndpointOptions.routes: |-
  sing-box 路由优先选择此 OpenVPN endpoint 的 IPv4 和 IPv6 前缀。

  这些 route 会与从服务器接受的 route 一起使用。
OpenVPNClientEndpointOptions.route_gateway: |-
  通过 OpenVPN endpoint 路由的 IPv4 gateway。

  为空时使用从服务器接收的 VPN gateway。
OpenVPNClientEndpointOptions.route_metric: |-
  通过 OpenVPN endpoint 路由的默认 metric。

  设为 `0` 时使用平台默认值。
OpenVPNClientEndpointOptions.redirect_gateway: |-
  在 sing-box 路由中对所有 IPv4 目的地优先选择 OpenVPN endpoint。

  默认禁用。
OpenVPNClientEndpointOptions.redirect_gateway_flags: |-
  OpenVPN `redirect-gateway` flag。

  `!ipv4` 禁用 IPv4 偏好，`def1` 使用两个 `/1` 前缀表示，`ipv6` 还会优先选择上游特定的 IPv6 前缀。`local`、`autolocal`、`bypass-dhcp` 和 `bypass-dns` 无效果。不支持 `block-local`。

  默认为空。
OpenVPNClientEndpointOptions.redirect_private: |-
  接受 `redirect_gateway_flags`，但不添加默认路由偏好。

  默认禁用。
OpenVPNClientEndpointOptions.block_ipv6: |-
  在本地拒绝 IPv6 流量，而不是通过 VPN 发送。

  默认禁用。
OpenVPNClientEndpointOptions.ping_interval: |-
  客户端未向服务器发送任何 packet 时，发送 data channel ping 的间隔。

  服务器推送的 OpenVPN `ping` 值优先于该值。

  该值必须使用整秒。

  默认禁用。
OpenVPNClientEndpointOptions.ping_restart: |-
  客户端未收到任何 packet 后重新连接服务器的时间。

  服务器推送的 OpenVPN `ping-restart` 值优先于该值。

  该值必须使用整秒。

  为空时，启用了 pull 的 UDP 连接会使用 `120s`，直到服务器推送其他值。TCP 不使用默认接收超时。
OpenVPNClientEndpointOptions.ping_restart_disabled: |-
  禁用初始 `120s` UDP 拉取超时和本地配置的 ping 重启超时。

  与 `ping_restart` 冲突。
OpenVPNClientEndpointOptions.renegotiate_interval: |-
  OpenVPN TLS 重新协商间隔。

  为空时使用 OpenVPN 默认值 `1h`。
OpenVPNClientEndpointOptions.renegotiate_disabled: |-
  禁用基于时间的 TLS 重新协商，包括默认间隔。

  与 `renegotiate_interval` 冲突。
OpenVPNClientEndpointOptions.renegotiate_bytes: 传输指定字节数后重新协商数据通道密钥。`0` 使用与密码算法相关的 OpenVPN 默认值。
OpenVPNClientEndpointOptions.renegotiate_packets: 传输指定数据包数后重新协商数据通道密钥。`0` 使用与密码算法相关的 OpenVPN 默认值。
OpenVPNClientEndpointOptions.tls_timeout: TLS 控制数据包的初始重传超时。为空时使用 OpenVPN 默认值 `2s`。
OpenVPNClientEndpointOptions.handshake_window: 初始 TLS 握手及每次重新协商的最长允许时间。为空时使用 OpenVPN 默认值 `1m`。
OpenVPNClientEndpointOptions.explicit_exit_notify: |-
  关闭 UDP 连接时发送的 OpenVPN exit notification 数量。

  Notification 之间间隔一秒。设为 `0` 时禁用。
OpenVPNClientEndpointOptions.on_demand: |-
  允许该 endpoint 在需要时断开连接。

  @Since 1.15.0
OpenVPNClientEndpointOptions.servers: |-
  OpenVPN 服务器列表。

  客户端按顺序尝试服务器，并在连接失败时尝试下一台服务器。

  `server` 和 `servers` 之一必填。

  与 `server` 冲突。
OpenVPNClientEndpointOptions.servers.server: |-
  OpenVPN 服务器地址。

  @Required
OpenVPNClientEndpointOptions.servers.server_port: |-
  OpenVPN 服务器端口。

  @Required
OpenVPNClientEndpointOptions.servers.network: |-
  该服务器的 OpenVPN 传输网络，可选值为 `udp` 或 `tcp`。

  默认使用顶层 `network`。
OpenVPNClientEndpointOptions.tls.server_name: |-
  预期的服务器证书名称。

  为空时禁用证书名称验证。
OpenVPNClientEndpointOptions.tls.server_name_type: |-
  与 `tls.server_name` 匹配的证书字段，可选值为 `subject`、`name` 或 `name-prefix`。

  设置 `tls.server_name` 时默认使用 `name`。

  `subject` 匹配完整证书 subject，`name` 精确匹配 common name，`name-prefix` 匹配 common name 前缀。
OpenVPNClientEndpointOptions.tls.certificate: |-
  受信任 CA 证书内容。

  `tls.certificate`、`tls.certificate_path` 和 `tls.peer_fingerprint` 之一必填。

  与 `tls.certificate_path` 冲突。
OpenVPNClientEndpointOptions.tls.certificate_path: |-
  受信任 CA 证书路径。

  `tls.certificate`、`tls.certificate_path` 和 `tls.peer_fingerprint` 之一必填。

  与 `tls.certificate` 冲突。
OpenVPNClientEndpointOptions.tls.client_certificate: |-
  客户端证书内容。

  与 `tls.client_certificate_path` 冲突。
OpenVPNClientEndpointOptions.tls.client_certificate_path: |-
  客户端证书路径。

  与 `tls.client_certificate` 冲突。
OpenVPNClientEndpointOptions.tls.client_key: |-
  客户端私钥内容。

  与 `tls.client_key_path` 冲突。
OpenVPNClientEndpointOptions.tls.client_key_path: |-
  客户端私钥路径。

  与 `tls.client_key` 冲突。

  客户端证书和私钥必须同时设置或同时为空。
OpenVPNClientEndpointOptions.tls.peer_fingerprint: |-
  允许的服务器 leaf certificate 的 SHA-256 fingerprint。

  每个 fingerprint 必须是不带分隔符的 64 字符小写十六进制字符串。
OpenVPNClientEndpointOptions.tls.crl_path: |-
  用于拒绝已吊销服务器证书的 PEM 或 DER CRL 文件路径。

  默认禁用。
OpenVPNClientEndpointOptions.tls.remote_certificate_ku: |-
  服务器证书所需的 Key Usage mask，使用 OpenVPN `remote-cert-ku` 格式的十六进制值。

  证书必须包含至少一个已配置 mask 中的所有 bit。

  默认禁用。
OpenVPNClientEndpointOptions.tls.remote_certificate_eku: |-
  服务器证书所需的 Extended Key Usage。

  接受 OpenSSL 名称、Object Identifier 以及 `server` 和 `client` 别名。

  设置后，该字段会替代默认的 `tls.remote_certificate_tls` 检查。

  与显式配置的 `tls.remote_certificate_tls` 冲突。
OpenVPNClientEndpointOptions.tls.remote_certificate_tls: |-
  对端证书用途检查，可选值为 `server`、`client` 或 `none`。

  默认使用 `server`。

  `none` 禁用证书用途检查。

  与 `tls.remote_certificate_eku` 冲突。
OpenVPNClientEndpointOptions.tls.certificate_profile: |-
  证书 profile，可选值为 `insecure`、`legacy`、`preferred` 或 `suiteb`。

  默认使用 `legacy`。

  `insecure` 为兼容不可变对端而接受使用 MD5 或 SHA-1 签名的证书链和较小的旧密钥，仅应在对端无法升级时使用。`legacy` 接受 SHA-1 但拒绝 MD5 签名；`preferred` 要求更强的签名和密钥。

  选择 `suiteb` 时，`tls.cipher` 为空则 TLS 1.2 cipher 列表默认使用 Suite B ECDHE-ECDSA AES-GCM 套件，`tls.groups` 为空则 TLS group 默认使用 `secp256r1` 和 `secp384r1`。
OpenVPNClientEndpointOptions.tls.ns_certificate_type: |-
  已弃用的 Netscape 证书类型检查，`server` 或 `client` 之一。

  默认禁用。请优先使用 `tls.remote_certificate_tls`。
OpenVPNClientEndpointOptions.tls.version_min: |-
  最低 TLS 版本，可选值为 `1.0`、`1.1`、`1.2` 或 `1.3`。

  默认使用 `1.2`。
OpenVPNClientEndpointOptions.tls.version_max: |-
  最高 TLS 版本，可选值为 `1.0`、`1.1`、`1.2` 或 `1.3`。

  默认使用支持的最高版本。

  该值不能低于 `tls.version_min`。
OpenVPNClientEndpointOptions.tls.cipher: |-
  TLS 1.2 及更低版本允许的 OpenSSL 或 IANA cipher suite 名称，以冒号分隔，如 `ECDHE-ECDSA-AES256-GCM-SHA384` 或 `TLS-ECDHE-ECDSA-WITH-AES-256-GCM-SHA384`。列表的顺序被忽略。

  为空时使用默认 TLS cipher suite。
OpenVPNClientEndpointOptions.tls.groups: |-
  以冒号分隔的 TLS key exchange group。列表的顺序被忽略。

  支持 `X25519`、`X25519MLKEM768`、`secp256r1`、`secp384r1` 和 `secp521r1`，包括其常用 OpenSSL 和 NIST 别名，不区分大小写。

  为空时使用默认 TLS group。
OpenVPNClientEndpointOptions.tls.control_wrap: |-
  OpenVPN 控制通道封装。

  等价于 OpenVPN `tls-auth`、`tls-crypt` 和 `tls-crypt-v2`。

  为空时禁用。
OpenVPNClientEndpointOptions.tls.control_wrap.type: 控制通道封装类型，可选值为 `tls_auth`、`tls_crypt` 或 `tls_crypt_v2`。
OpenVPNClientEndpointOptions.tls.control_wrap.key: |-
  控制通道封装密钥内容。

  与 `tls.control_wrap.key_path` 冲突。
OpenVPNClientEndpointOptions.tls.control_wrap.key_path: |-
  控制通道封装密钥路径。

  与 `tls.control_wrap.key` 冲突。
OpenVPNClientEndpointOptions.tls.control_wrap.direction: |-
  `tls-auth` 密钥方向，可选值为 `server` 或 `client`。

  仅当 `tls.control_wrap.type` 为 `tls_auth` 时可用。为空时双向使用密钥。
OpenVPNClientEndpointOptions.pull_filters.action: |-
  Filter action，可选值为 `accept`、`ignore` 或 `reject`。

  `accept` 应用选项，`ignore` 丢弃选项，`reject` 终止连接。

  @Required
OpenVPNClientEndpointOptions.pull_filters.text: |-
  用于匹配推送选项名称和值的大小写敏感前缀。

  例如，`route ` 会匹配推送的 IPv4 route 选项，但不会匹配 `route-gateway`。

  @Required
OpenVPNServerEndpointOptions.system: |-
  使用系统接口。

  需要特权且不能与已有系统接口冲突。

  如果禁用，sing-box 将使用内部网络栈。
OpenVPNServerEndpointOptions.name: |-
  系统接口的自定义接口名称。

  默认使用自动生成的 `ovpn` 接口名称。
OpenVPNServerEndpointOptions.mtu: |-
  OpenVPN 接口 MTU。

  默认使用 `1500`。
OpenVPNServerEndpointOptions.mode: |-
  OpenVPN 会话模式，`tls` 或 `static_key` 之一。

  `static_key` 在没有 TLS 控制信道和前向保密的情况下服务一个对端。
OpenVPNServerEndpointOptions.network: |-
  OpenVPN 传输网络，`udp` 或 `tcp` 之一。

  每个端点仅服务一种传输网络；如需同时服务 TCP 与 UDP，
  需要配置两个端点并使用互不重叠的 `address` 子网。
OpenVPNServerEndpointOptions.remote: |-
  UDP `static_key` 服务器的固定远端地址。

  在 UDP `static_key` 模式下与 `remote_port` 一起必填。
OpenVPNServerEndpointOptions.remote_port: |-
  UDP `static_key` 服务器的固定远端端口。

  在 UDP `static_key` 模式下与 `remote` 一起必填。
OpenVPNServerEndpointOptions.max_clients: |-
  已建立与握手中的 TLS 客户端会话的最大数量。

  默认使用 `1024`。最大值为 `16777215`。

  在 `static_key` 模式下必须为 `0` 或 `1`。
OpenVPNServerEndpointOptions.address: |-
  OpenVPN 服务器地址前缀列表。

  最多支持一个 IPv4 前缀和一个 IPv6 前缀。

  前缀地址被分配给服务器接口。掩码后的前缀用作客户端地址池和路由。

  第一个 IPv4 和 IPv6 前缀地址用作端点的本地地址。

  在 `static_key` 模式下，这些地址是本地隧道前缀，而不是地址池。

  @Required
OpenVPNServerEndpointOptions.peer_address: |-
  IPv4 隧道对端地址。

  在 `static_key` 模式下配置 IPv4 `address` 时必填。
OpenVPNServerEndpointOptions.peer_address_ipv6: |-
  IPv6 隧道对端地址。

  在 `static_key` 模式下配置 IPv6 `address` 时必填。
OpenVPNServerEndpointOptions.topology: |-
  推送给客户端的 OpenVPN topology，`subnet`、`p2p` 或 `net30` 之一。

  TLS 模式默认使用 `subnet`，`static_key` 模式默认使用 `p2p`。
OpenVPNServerEndpointOptions.duplicate_cn: |-
  允许具有相同认证证书 common name 或用户名的多个客户端同时在线。

  禁用时，新认证的会话会替换具有相同身份的现有会话，并在可用时复用其 tunnel 地址。

  默认禁用。

  仅在 TLS 模式下可用。
OpenVPNServerEndpointOptions.users: |-
  OpenVPN 用户名/密码用户列表。

  如果设置，客户端除了通过 `tls.verify_client_certificate` 配置的证书策略外，还必须通过用户名/密码认证。

  仅在 TLS 模式下可用。
OpenVPNServerEndpointOptions.users.username: 用户名。
OpenVPNServerEndpointOptions.users.password: 密码。
OpenVPNServerEndpointOptions.static_key: |-
  OpenVPN 静态密钥内容。

  在 `static_key` 模式下必填。

  与 `static_key_path` 冲突。
OpenVPNServerEndpointOptions.static_key_path: |-
  OpenVPN 静态密钥路径。

  在 `static_key` 模式下未设置 `static_key` 时必填。

  与 `static_key` 冲突。
OpenVPNServerEndpointOptions.key_direction: |-
  静态密钥方向，`server` 或 `client` 之一。

  为空时双向使用密钥。按照惯例，服务器使用 `server`，对端使用 `client`。

  仅在 `static_key` 模式下可用。
OpenVPNServerEndpointOptions.tls: |-
  在 TLS 模式下必填。

  OpenVPN 控制信道 TLS 配置。
OpenVPNServerEndpointOptions.cipher: |-
  `static_key` 模式使用的数据信道加密方式。

  为空时使用上游静态密钥模式的默认值 `BF-CBC`。支持 AES-CBC、ARIA-CBC、Camellia-CBC、DES-CBC、Blowfish-CBC、CAST5-CBC 系列，以及 `SEED-CBC`、`SM4-CBC` 和 `NONE`。

  仅在 `static_key` 模式下可用。
OpenVPNServerEndpointOptions.data_ciphers: |-
  允许的 OpenVPN 数据信道加密方式。

  默认使用 `AES-256-GCM`、`AES-128-GCM` 和 `CHACHA20-POLY1305`。

  AES-GCM 系列还包括 `AES-192-GCM`。保留的 cipher 包括 AES、ARIA、Camellia、DES、Blowfish、CAST5、SEED 和 SM4 的 CBC、CFB、OFB 形式，以及 `NONE`。CFB 和 OFB 仅可用于 TLS 模式。

  仅在 TLS 模式下可用。
OpenVPNServerEndpointOptions.data_ciphers_fallback: |-
  用于不支持加密方式协商的遗留客户端的 OpenVPN 数据信道加密方式。

  等价于 OpenVPN `data-ciphers-fallback`。

  默认禁用。

  仅在 TLS 模式下可用。
OpenVPNServerEndpointOptions.auth: |-
  OpenVPN 数据信道认证摘要。

  默认使用 `SHA1`，仅对非 AEAD 数据信道加密方式和 `tls_auth` 生效。
OpenVPNServerEndpointOptions.mss_fix: 用于限制 TCP MSS 的最大封装数据包大小。默认 MTU 下使用上游默认值 `1492` 计算。
OpenVPNServerEndpointOptions.mss_fix_disabled: 禁用 MSS 限制，包括默认限制。
OpenVPNServerEndpointOptions.mss_fix_mode: 显式 `mss_fix` 的计算模式，`mtu` 或 `fixed` 之一。需要 `mss_fix`。
OpenVPNServerEndpointOptions.replay_window: UDP 数据通道重放窗口大小。默认使用 `64`。
OpenVPNServerEndpointOptions.replay_window_time: UDP 重放窗口时长。默认使用 `15s`。该值必须使用整秒。
OpenVPNServerEndpointOptions.push: 推送给客户端的选项。
OpenVPNServerEndpointOptions.push.routes: |-
  推送给客户端的路由。

  IPv4 和 IPv6 前缀可以混用。
OpenVPNServerEndpointOptions.push.dns: |-
  推送给客户端的 DNS 服务器地址。

  使用传统的 `dhcp-option DNS`/`DNS6`。兼容客户端收到现代 DNS 服务器组时会覆盖这些地址。
OpenVPNServerEndpointOptions.push.dns_servers: |-
  推送的现代 OpenVPN DNS 服务器组。每项包含 `priority`、`addresses`，以及可选的 `resolve_domains`、`dnssec`、`transport` 和 `sni`。

  地址接受 IP 或 `IP:port`（带端口的 IPv6 使用 `[IPv6]:port`）。`transport` 为 `plain`、`dot` 或 `doh` 之一；`dnssec` 为 `yes`、`optional` 或 `no` 之一。OpenVPN 客户端仅应用优先级数字最低的服务器组。
OpenVPNServerEndpointOptions.push.search_domains: 推送的现代 OpenVPN 搜索域。
OpenVPNServerEndpointOptions.push.dhcp_options: 推送的额外传统 `dhcp-option` 值，不包含 `dhcp-option` 前缀。
OpenVPNServerEndpointOptions.push.redirect_gateway: |-
  向客户端推送 `redirect-gateway`，根据 `push.redirect_gateway_flags` 通过 VPN 路由客户端流量。

  当 `push.redirect_gateway_flags` 为空时，默认使用 `def1`。
OpenVPNServerEndpointOptions.push.redirect_gateway_flags: |-
  向客户端推送的 OpenVPN `redirect-gateway` flag。

  仅当启用 `push.redirect_gateway` 时可用。

  默认使用 `def1`。
OpenVPNServerEndpointOptions.push.block_outside_dns: 向客户端推送 `block-outside-dns`，在 Windows 客户端上阻止 VPN 之外的 DNS 查询。
OpenVPNServerEndpointOptions.push.ping_interval: |-
  推送给客户端的 OpenVPN `ping` 间隔。

  在该间隔内未发送任何 packet 后，客户端会向服务器发送一个 data channel ping。

  该值必须使用整秒。

  默认禁用。
OpenVPNServerEndpointOptions.push.ping_restart: |-
  推送给客户端的 OpenVPN `ping-restart` 超时。

  在该超时时间内未收到任何 packet 后，客户端会重新连接服务器。

  该值必须使用整秒。

  默认禁用。
OpenVPNServerEndpointOptions.ping_interval: |-
  服务器未向客户端发送任何 packet 时，发送 data channel ping 的间隔。

  该值应用于服务器。使用 `push.ping_interval` 配置客户端。

  该值必须使用整秒。

  默认禁用。
OpenVPNServerEndpointOptions.ping_restart: |-
  服务器未收到任何 packet 后关闭客户端会话的时间。

  该值应用于服务器。使用 `push.ping_restart` 配置客户端。

  该值必须使用整秒。

  默认禁用。
OpenVPNServerEndpointOptions.renegotiate_interval: |-
  OpenVPN TLS 重协商间隔。

  为空时使用 OpenVPN 默认值 `1h`。

  仅在 TLS 模式下可用。
OpenVPNServerEndpointOptions.renegotiate_disabled: |-
  禁用基于时间的 TLS 重协商，包括默认间隔。

  仅在 TLS 模式下可用。
OpenVPNServerEndpointOptions.renegotiate_bytes: |-
  传输指定字节数后重新协商数据通道密钥。`0` 使用与密码算法相关的 OpenVPN 默认值。

  仅在 TLS 模式下可用。
OpenVPNServerEndpointOptions.renegotiate_packets: |-
  传输指定数据包数后重新协商数据通道密钥。`0` 使用与密码算法相关的 OpenVPN 默认值。

  仅在 TLS 模式下可用。
OpenVPNServerEndpointOptions.handshake_window: |-
  初始 TLS 握手和每次 TLS 重协商允许使用的最长时间。

  仅在 TLS 模式下可用。
OpenVPNServerEndpointOptions.tls.certificate: |-
  TLS 服务器证书内容。

  `tls.certificate` 或 `tls.certificate_path` 必填其一。

  与 `tls.certificate_path` 冲突。
OpenVPNServerEndpointOptions.tls.certificate_path: |-
  TLS 服务器证书路径。

  `tls.certificate` 或 `tls.certificate_path` 必填其一。

  与 `tls.certificate` 冲突。
OpenVPNServerEndpointOptions.tls.key: |-
  TLS 服务器私钥内容。

  `tls.key` 或 `tls.key_path` 必填其一。

  与 `tls.key_path` 冲突。
OpenVPNServerEndpointOptions.tls.key_path: |-
  TLS 服务器私钥路径。

  `tls.key` 或 `tls.key_path` 必填其一。

  与 `tls.key` 冲突。
OpenVPNServerEndpointOptions.tls.client_certificate: |-
  TLS CA 证书内容，用于验证客户端证书。

  当 `tls.verify_client_certificate` 为 `require` 或 `optional` 时，`tls.client_certificate`、`tls.client_certificate_path` 或 `tls.peer_fingerprint` 必填其一。

  与 `tls.client_certificate_path` 冲突。
OpenVPNServerEndpointOptions.tls.client_certificate_path: |-
  TLS CA 证书路径，用于验证客户端证书。

  当 `tls.verify_client_certificate` 为 `require` 或 `optional` 时，`tls.client_certificate`、`tls.client_certificate_path` 或 `tls.peer_fingerprint` 必填其一。

  与 `tls.client_certificate` 冲突。
OpenVPNServerEndpointOptions.tls.verify_client_certificate: |-
  OpenVPN 客户端证书策略，`require`、`optional` 或 `none` 之一。

  默认使用 `require`。

  设为 `optional` 时，客户端提供证书则验证，不提供证书的客户端也被允许。

  设为 `none` 时，不请求客户端证书。
OpenVPNServerEndpointOptions.tls.client_name: 期望的客户端证书名称。为空时禁用。
OpenVPNServerEndpointOptions.tls.client_name_type: |-
  `tls.client_name` 匹配的证书字段，`subject`、`name` 或 `name-prefix` 之一。

  配置 `tls.client_name` 时默认使用 `name`。
OpenVPNServerEndpointOptions.tls.peer_fingerprint: 允许的客户端叶证书 SHA-256 指纹。可以在没有客户端 CA 时仅使用指纹验证。
OpenVPNServerEndpointOptions.tls.crl_path: 用于拒绝已吊销客户端证书的证书吊销列表路径。
OpenVPNServerEndpointOptions.tls.remote_certificate_ku: OpenVPN `remote-cert-ku` 格式的客户端证书 Key Usage mask。
OpenVPNServerEndpointOptions.tls.remote_certificate_eku: 客户端证书所需的 Extended Key Usage。与显式配置的 `tls.remote_certificate_tls` 冲突。
OpenVPNServerEndpointOptions.tls.remote_certificate_tls: 客户端证书用途检查，`server`、`client` 或 `none` 之一。默认使用 `client`。
OpenVPNServerEndpointOptions.tls.certificate_profile: |-
  证书 profile，可选值为 `insecure`、`legacy`、`preferred` 或 `suiteb`。

  默认使用 `legacy`。

  `insecure` 为兼容不可变对端而接受使用 MD5 或 SHA-1 签名的证书链和较小的旧密钥，仅应在对端无法升级时使用。`legacy` 接受 SHA-1 但拒绝 MD5 签名；`preferred` 要求更强的签名和密钥。

  选择 `suiteb` 时，`tls.cipher` 为空则 TLS 1.2 cipher 列表默认使用 Suite B ECDHE-ECDSA AES-GCM 套件，`tls.groups` 为空则 TLS group 默认使用 `secp256r1` 和 `secp384r1`。
OpenVPNServerEndpointOptions.tls.ns_certificate_type: 已弃用的 Netscape 证书类型检查，`server` 或 `client` 之一。
OpenVPNServerEndpointOptions.tls.version_min: 最低 TLS 版本。默认使用 `1.2`。
OpenVPNServerEndpointOptions.tls.version_max: 最高 TLS 版本。默认使用支持的最高版本。
OpenVPNServerEndpointOptions.tls.cipher: |-
  TLS 1.2 及更低版本允许的 OpenSSL 或 IANA cipher suite 名称，以冒号分隔，如 `ECDHE-ECDSA-AES256-GCM-SHA384` 或 `TLS-ECDHE-ECDSA-WITH-AES-256-GCM-SHA384`。列表的顺序被忽略。

  为空时使用默认 TLS cipher suite。
OpenVPNServerEndpointOptions.tls.groups: |-
  以冒号分隔的 TLS key exchange group。列表的顺序被忽略。

  支持 `X25519`、`X25519MLKEM768`、`secp256r1`、`secp384r1` 和 `secp521r1`，包括其常用 OpenSSL 和 NIST 别名，不区分大小写。

  为空时使用默认 TLS group。
OpenVPNServerEndpointOptions.tls.control_wrap: |-
  OpenVPN 控制信道包装。

  等价于 OpenVPN `tls-auth`、`tls-crypt` 和 `tls-crypt-v2`。

  默认禁用。
OpenVPNServerEndpointOptions.tls.control_wrap.type: |-
  控制信道包装类型，`tls_auth`、`tls_crypt` 或 `tls_crypt_v2` 之一。

  对于 `tls_crypt_v2`，密钥为服务器密钥。

  @Required
OpenVPNServerEndpointOptions.tls.control_wrap.key: |-
  控制信道包装密钥内容。

  `tls.control_wrap.key` 或 `tls.control_wrap.key_path` 必填其一。

  与 `tls.control_wrap.key_path` 冲突。
OpenVPNServerEndpointOptions.tls.control_wrap.key_path: |-
  控制信道包装密钥路径。

  `tls.control_wrap.key` 或 `tls.control_wrap.key_path` 必填其一。

  与 `tls.control_wrap.key` 冲突。
OpenVPNServerEndpointOptions.tls.control_wrap.direction: |-
  OpenVPN `tls-auth` 密钥方向，`server` 或 `client` 之一。

  仅当 `tls.control_wrap.type` 为 `tls_auth` 时可用。

  `server` 对应 OpenVPN 密钥方向 `0`，`client` 对应 `1`；按照惯例服务器使用 `0`，客户端使用 `1`。

  如果为空，密钥被双向使用，与两端均省略 `key-direction` 的行为一致。
OpenVPNServerEndpointOptions.tls.control_wrap.force_cookie: |-
  要求 UDP 上的 `tls-crypt-v2` 客户端支持无状态 session cookie。

  仅当 `tls.control_wrap.type` 为 `tls_crypt_v2` 时可用。禁用时，不支持 cookie 的客户端会按照上游 `allow-noncookie` 行为被接受。

  默认禁用。
